<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>404 - ToolHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<style>
  :root { --bg: #0a0e17; --card: rgba(15,21,32,0.78); --primary: #7c3aed; --primary-light: #8b5cf6; --text: #f1f5f9; --muted: #64748b; --border: rgba(255,255,255,0.06); }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-size:16px;-webkit-font-smoothing:antialiased}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
  .error-wrap{text-align:center;padding:48px 24px}
  .error-code{font-size:clamp(80px,15vw,140px);font-weight:800;background:linear-gradient(135deg,var(--primary-light),#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;margin-bottom:8px}
  .error-title{font-size:clamp(1.2rem,3vw,1.8rem);font-weight:700;margin-bottom:12px}
  .error-desc{color:var(--muted);font-size:0.95rem;max-width:380px;margin:0 auto 32px;line-height:1.6}
  .error-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 28px;border-radius:8px;font-size:0.95rem;font-weight:600;text-decoration:none;transition:all 0.2s cubic-bezier(0.22,1,0.36,1)}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(124,58,237,0.35)}
  .btn-primary:hover{background:var(--primary-light);transform:translateY(-1px);box-shadow:0 4px 16px rgba(124,58,237,0.4)}
  .btn-ghost{color:var(--muted);border:1px solid var(--border)}
  .btn-ghost:hover{color:var(--text);border-color:rgba(255,255,255,0.15);background:rgba(255,255,255,0.05)}
</style>
</head>
<body>
<main class="error-wrap">
  <div class="error-code">404</div>
  <h1 class="error-title">页面未找到</h1>
  <p class="error-desc">您访问的页面不存在或已被移除，请返回 ToolHub 首页继续浏览工具。</p>
  <div class="error-actions">
    <a href="/" class="btn btn-primary">返回首页</a>
    <a href="javascript:history.back()" class="btn btn-ghost">返回上页</a>
  </div>
</main>
</body>
</html>
