<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>页面未找到 - 个人工具合集</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="页面未找到，返回个人工具合集首页继续浏览。">
<meta property="og:title" content="页面未找到 - 个人工具合集">
<meta property="og:description" content="返回个人工具合集首页继续浏览。">
<meta property="og:url" content="https://shancha.dpdns.org/404.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://shancha.dpdns.org/404.html">
<link rel="stylesheet" href="styles.css">
<style>
  .error-container {
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }
  .error-code {
    font-size: 120px;
    font-weight: 800;
    background: linear-gradient(135deg, #f06292, #ba68c8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 10px;
  }
  .error-title {
    font-size: 28px;
    color: #fff;
    margin-bottom: 16px;
  }
  .error-desc {
    font-size: 16px;
    color: rgba(255,255,255,0.7);
    margin-bottom: 32px;
    max-width: 400px;
  }
  .error-actions {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn-home {
    display: inline-block;
    padding: 12px 32px;
    background: linear-gradient(135deg, #f06292, #ba68c8);
    color: #fff;
    border-radius: 25px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-home:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(240,98,146,0.4);
  }
  .btn-back {
    display: inline-block;
    padding: 12px 32px;
    background: transparent;
    color: #f06292;
    border: 2px solid #f06292;
    border-radius: 25px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    transition: background 0.2s, color 0.2s;
  }
  .btn-back:hover {
    background: #f06292;
    color: #fff;
  }
</style>
</head>
<body>

<main class="error-container">
  <div class="error-code">404</div>
  <h1 class="error-title">页面未找到</h1>
  <p class="error-desc">抱歉，您访问的页面不存在或已被移除。请返回首页继续浏览工具。</p>
  <div class="error-actions">
    <a href="index.html" class="btn-home">返回首页</a>
    <a href="javascript:history.back()" class="btn-back">返回上页</a>
  </div>
</main>

</body>
</html>
