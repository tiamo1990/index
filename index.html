<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f0f2f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
<title>华为 HCIP-Datacom 题库练习系统</title>
<style>
:root {
  --bg-start: #f0f2f5;
  --bg-end: #f5f6f8;
  --bg-mid: #eef0f2;
  --glass-bg: #ffffff;
  --glass-bg-hover: #f8f9fa;
  --glass-bg-active: #f0f2f5;
  --glass-border: rgba(0,0,0,0.08);
  --glass-border-hover: rgba(0,0,0,0.15);
  --glass-border-glow: rgba(207,10,44,0.25);
  --glass-shadow: 0 2px 12px rgba(0,0,0,0.08);
  --glass-shadow-sm: 0 1px 6px rgba(0,0,0,0.06);
  --glass-blur: none;
  --text: #1a1a2e;
  --text2: #666680;
  --text3: #999aaa;
  --primary: #CF0A2C;
  --primary-dark: #a00820;
  --primary-glow: rgba(207,10,44,0.12);
  --primary-soft: rgba(207,10,44,0.06);
  --primary-light: rgba(207,10,44,0.08);
  --success: #16a34a;
  --success-soft: rgba(22,163,74,0.08);
  --success-border: rgba(22,163,74,0.25);
  --danger: #dc2626;
  --danger-soft: rgba(220,38,38,0.08);
  --danger-border: rgba(220,38,38,0.25);
  --warning: #d97706;
  --warning-soft: rgba(217,119,6,0.08);
  --card-bg: #ffffff;
  --card-inner: #f8fafc;
  --surface-bg: #f8fafc;
  --dark-text: #1a1a2e;
  --border: rgba(0,0,0,0.08);
  --radius: 18px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --radius-full: 9999px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  --type-single: #6366f1;
  --type-multiple: #d97706;
  --type-judge: #16a34a;
  --type-fill: #7c3aed;
  --type-drag: #db2777;
  --hw-red: #CF0A2C;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: #f0f2f5;
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

#app {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
  position: relative;
  z-index: 1;
}

/* ===== Header ===== */
.header {
  text-align: center;
  padding: 36px 20px 28px;
}
.header h1 {
  font-size: 30px;
  font-weight: 800;
  color: var(--dark-text);
  margin-bottom: 6px;
  letter-spacing: 1px;
}
.header .subtitle {
  font-size: 14px;
  color: var(--text2);
  letter-spacing: 0.8px;
  font-weight: 400;
}

/* ===== Home Cards (Glass) ===== */
/* ===== Homepage Stats Bar ===== */
.home-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--glass-bg);
  border-radius: var(--radius);
  padding: 16px 16px;
  border: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  gap: 14px;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
}
.stat-card:hover {
  transform: translateY(-2px);
  background: var(--glass-bg-hover);
  border-color: var(--glass-border-hover);
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.stat-card .stat-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.stat-card .stat-info { flex: 1; min-width: 0; }
.stat-card .stat-num { font-size: 22px; font-weight: 800; color: var(--text); line-height: 1.2; }
.stat-card .stat-label { font-size: 11px; color: var(--text2); letter-spacing: 0.3px; }
.stat-card-static { cursor: default; pointer-events: none; }

/* ===== Homepage Core Area ===== */
.home-core {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 24px;
}
.core-card {
  background: var(--glass-bg);
  border-radius: var(--radius);
  padding: 32px;
  border: 1px solid var(--glass-border);
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 208px;
}
.core-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  opacity: 0;
  transition: opacity var(--transition);
  background: radial-gradient(500px circle at 30% 20%, rgba(207,10,44,0.03), transparent 50%);
  pointer-events: none;
}
.core-card:hover {
  transform: translateY(-2px);
  background: var(--glass-bg-hover);
  border-color: var(--glass-border-hover);
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
}
.core-card:hover::before { opacity: 1; }
.core-card:active { transform: translateY(0); }
.core-card .core-icon {
  width: 56px; height: 56px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  margin-bottom: 16px;
  border: 1px solid rgba(0,0,0,0.06);
}
.core-card .core-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.core-card .core-desc { font-size: 13px; color: var(--text2); margin-bottom: 16px; line-height: 1.6; }
.core-card .core-meta { font-size: 12px; color: var(--text2); margin-bottom: 16px; padding: 8px 12px; background: rgba(0,0,0,0.03); border-radius: var(--radius-sm); }
.core-card .core-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--primary);
  color: #fff;
  padding: 10px 28px;
  border-radius: var(--radius-full);
  font-size: 14px; font-weight: 600;
  transition: all var(--transition-fast);
  align-self: flex-start;
  border: none;
  box-shadow: 0 4px 14px rgba(207,10,44,0.28);
}
.core-card .core-btn:hover {
  background: #e01130;
  box-shadow: 0 6px 20px rgba(207,10,44,0.4);
  transform: translateY(-1px);
}

/* Practice sub-items */
.practice-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  background: rgba(0,0,0,0.02);
  border: 1px solid rgba(0,0,0,0.04);
  cursor: pointer;
  transition: all var(--transition);
}
.practice-item + .practice-item { margin-top: 12px; }
.practice-item:hover {
  background: rgba(0,0,0,0.04);
  border-color: rgba(0,0,0,0.1);
}
.practice-item .pi-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.practice-item .pi-title { font-size: 15px; font-weight: 600; color: var(--text); }
.practice-item .pi-desc { font-size: 11px; color: var(--text2); }

/* ===== Homepage Tools Grid ===== */
.home-tools {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 24px;
}
.tool-card {
  background: var(--glass-bg);
  border-radius: var(--radius);
  padding: 24px 18px 20px;
  border: 1px solid var(--glass-border);
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.tool-card:hover {
  border-color: var(--glass-border-hover);
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.tool-card:active { transform: translateY(0); }

/* ===== Subject Select ===== */
.subject-select-container {
  max-width: 800px; margin: 0 auto;
  padding: 0 20px;
}
.subject-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}
.subject-card {
  background: var(--glass-bg);
  border-radius: var(--radius);
  border: 2px solid var(--glass-border);
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
  display: flex;
}
.subject-card.ready:hover {
  border-color: var(--glass-border-hover);
  transform: translateY(-3px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
}
.subject-card.ready {
  transition: background-color 0.2s ease-out, transform 0.15s ease-out,
              border-color 0.2s ease-out, box-shadow 0.2s ease-out;
}
.subject-card.active {
  border-color: var(--primary);
  box-shadow: 0 0 0 1px var(--primary);
}
.subject-card.pending {
  opacity: 0.65;
  cursor: not-allowed;
}
.subject-card.pending:hover {
  transform: none;
}
.subject-color-bar {
  width: 6px; flex-shrink: 0;
}
.subject-content {
  padding: 20px 24px;
  flex: 1;
}
.subject-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 8px;
}
.subject-code {
  font-size: 13px; font-weight: 700;
  background: rgba(0,0,0,0.06);
  padding: 2px 10px; border-radius: 6px;
  color: var(--text);
}
.subject-active-badge {
  font-size: 11px; font-weight: 600;
  background: var(--primary); color: #fff;
  padding: 2px 8px; border-radius: 6px;
}
.subject-pending-badge {
  font-size: 11px; font-weight: 600;
  background: rgba(0,0,0,0.12); color: var(--text3);
  padding: 2px 8px; border-radius: 6px;
}
.subject-name {
  font-size: 18px; font-weight: 700;
  color: var(--text); margin-bottom: 4px;
}
.subject-subtitle {
  font-size: 12px; color: var(--text3);
  margin-bottom: 12px;
}
.subject-stats {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 8px;
}
.subject-stats span {
  font-size: 12px; color: var(--text2);
  background: rgba(0,0,0,0.04);
  padding: 2px 8px; border-radius: 6px;
}
.subject-total {
  font-size: 14px; font-weight: 700;
  color: var(--text);
}
.subject-tips {
  background: var(--glass-bg);
  border-radius: var(--radius);
  padding: 20px 24px;
  border: 1px solid var(--glass-border);
}
.subject-tips h4 {
  font-size: 14px; margin-bottom: 10px;
}
.subject-tips ul {
  padding-left: 20px;
}
.subject-tips li {
  font-size: 13px; color: var(--text2);
  margin-bottom: 6px; line-height: 1.6;
}
.tool-card .tool-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  margin-bottom: 10px;
}
.tool-card .tool-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
.tool-card .tool-desc { font-size: 11px; color: var(--text2); }
.tool-card .tool-dot {
  position: absolute;
  top: 14px; right: 14px;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--primary);
  opacity: 0.55;
  box-shadow: 0 0 6px rgba(207,10,44,0.3);
}

/* ===== Continue Practice Bar ===== */
.home-continue {
  background: var(--glass-bg);
  border-radius: var(--radius);
  padding: 18px 24px;
  border: 1px solid rgba(207,10,44,0.12);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: all var(--transition);
  margin-bottom: 24px;
  animation: breathe 3s ease-in-out infinite;
}
.home-continue:hover {
  background: var(--glass-bg-hover);
  border-color: rgba(207,10,44,0.28);
  box-shadow: 0 2px 8px rgba(207,10,44,0.1);
}
.home-continue .cont-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: rgba(207,10,44,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--primary);
  flex-shrink: 0;
  animation: brandPulse 2.5s ease-in-out infinite;
}
.home-continue .cont-info { flex: 1; margin: 0 16px; min-width: 0; }
.home-continue .cont-title { font-size: 14px; font-weight: 600; color: var(--text); }
.home-continue .cont-desc { font-size: 12px; color: var(--text2); }
.home-continue .cont-arrow { color: var(--text2); font-size: 18px; flex-shrink: 0; }

/* ===== Config Panel (Glass) ===== */
.config-container {
  max-width: 560px;
  margin: 24px auto;
  background: var(--glass-bg);
  border-radius: var(--radius);
  padding: 32px 36px;
  box-shadow: var(--glass-shadow);
  border: 1px solid var(--glass-border);
}
.config-title {
  font-size: 22px; font-weight: 700;
  text-align: center; margin-bottom: 28px;
  color: var(--text);
}
.config-type-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
  padding: 8px 0;
}
.config-type-label {
  width: 140px;
  font-size: 14px;
  font-weight: 500;
  flex-shrink: 0;
  color: var(--text);
}
.config-type-avail { font-size: 12px; color: var(--text2); font-weight: 400; }
.config-type-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  border-radius: 3px;
  background: rgba(0,0,0,0.1);
  outline: none;
  cursor: pointer;
}
.config-type-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--primary);
  cursor: pointer;
  box-shadow: 0 0 12px var(--primary-glow);
  /* transition: var(--transition); */
  border: 2px solid rgba(0,0,0,0.1);
}
.config-type-slider::-webkit-slider-thumb:hover { /* transform: scale(1.15); */ }
.config-type-input {
  width: 64px;
  text-align: center;
  background: rgba(0,0,0,0.04);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-xs);
  padding: 7px 4px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  outline: none;
  transition: var(--transition-fast);
}
.config-type-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
  background: rgba(0,0,0,0.06);
}

.config-divider {
  height: 1px;
  background: var(--glass-border);
  margin: 18px 0;
}
.config-summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  font-weight: 600;
  color: var(--text);
}
.config-summary-count { font-size: 22px; color: var(--primary); font-weight: 700; }
.config-scoring { margin-top: 14px; }
.config-scoring-row {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px;
}
.config-scoring-row label { width: 80px; font-size: 13px; color: var(--text2); flex-shrink: 0; }
.config-scoring-row input {
  width: 96px; padding: 7px 10px;
  background: rgba(0,0,0,0.04);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-xs);
  font-size: 13px;
  color: var(--text);
  outline: none;
  transition: var(--transition-fast);
}
.config-scoring-row input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.config-actions {
  display: flex; gap: 12px; margin-top: 24px;
}
.config-actions button { flex: 1; }
.config-hint {
  font-size: 12px; color: var(--text2);
  margin-top: 14px; text-align: center;
}

/* ===== Buttons (Glass) ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px 22px;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-full);
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  transition: all var(--transition-fast);
  white-space: nowrap;
  background: rgba(0,0,0,0.04);
  color: var(--text);
  letter-spacing: 0.3px;
}
.btn:hover:not(:disabled) {
  background: #f0f2f5;
  border-color: var(--glass-border-hover);
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
.btn-primary {
  background: linear-gradient(135deg, var(--primary), #e0113a);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 16px var(--primary-glow);
}
.btn-primary:hover:not(:disabled) {
  background: linear-gradient(135deg, #e0113a, #f0123d);
  box-shadow: 0 6px 24px var(--primary-glow);
  border-color: transparent;
}
.btn-outline {
  background: transparent;
  border: 1.5px solid var(--glass-border);
  color: var(--text);
}
.btn-outline:hover:not(:disabled) {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-soft);
}
.btn-blue {
  background: linear-gradient(135deg, #6366f1, #818cf8);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 16px rgba(99,102,241,0.3);
}
.btn-blue:hover:not(:disabled) { box-shadow: 0 6px 24px rgba(99,102,241,0.4); }
.btn-danger {
  background: linear-gradient(135deg, #ef4444, #f87171);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 16px rgba(239,68,68,0.3);
}
.btn-success {
  background: linear-gradient(135deg, #22c55e, #4ade80);
  color: var(--dark-text);
  border-color: transparent;
  box-shadow: 0 4px 16px rgba(34,197,94,0.3);
}
.btn-ghost {
  background: transparent; color: var(--text2);
  border: 1px solid transparent;
}
.btn-ghost:hover:not(:disabled) { border-color: var(--glass-border); background: rgba(0,0,0,0.03); }
.btn-sm { padding: 6px 16px; font-size: 12px; }
.btn-lg { padding: 13px 30px; font-size: 16px; }
.btn-block { width: 100%; }

/* Subject switch button - GPU-friendly transitions */
.subject-switch-btn {
  transition: background-color 0.2s ease-out, transform 0.15s ease-out,
              border-color 0.2s ease-out, box-shadow 0.2s ease-out,
              color 0.2s ease-out !important;
}

/* ===== Quiz Layout (Glass) ===== */
.quiz-container {
  display: flex;
  gap: 22px;
  align-items: flex-start;
}
.quiz-main {
  flex: 1;
  min-width: 0;
  position: sticky;
  top: 24px;
}
.quiz-panel {
  width: 230px;
  flex-shrink: 0;
  max-height: calc(100vh - 200px);
  overflow-y: auto;
  background: var(--glass-bg);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--glass-shadow-sm);
  border: 1px solid var(--glass-border);
  position: sticky;
  top: 24px;
}
.quiz-panel::-webkit-scrollbar { width: 4px; }
.quiz-panel::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 2px; }

.panel-header {
  font-size: 14px; font-weight: 700;
  margin-bottom: 14px;
  display: flex; justify-content: space-between; align-items: center;
  color: var(--text);
}
.panel-stats { font-size: 11px; color: var(--text2); font-weight: 400; }
.panel-toggle { display: none; cursor: pointer; font-size: 16px; padding: 2px 8px; border-radius: 4px; background: rgba(0,0,0,0.05); border: none; color: var(--text2); }
.panel-toggle:hover { background: rgba(0,0,0,0.1); }

.nav-type-group { margin-bottom: 14px; }
.nav-type-header {
  font-size: 11px; font-weight: 700;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  margin-bottom: 7px;
  display: inline-block;
  letter-spacing: 0.5px;
}
.nav-type-header.single { background: rgba(129,140,248,0.15); color: #818cf8; }
.nav-type-header.multiple { background: rgba(251,191,36,0.15); color: #fbbf24; }
.nav-type-header.judge { background: rgba(74,222,128,0.15); color: #4ade80; }
.nav-type-header.fill { background: rgba(167,139,250,0.15); color: #a78bfa; }
.nav-type-header.drag { background: rgba(244,114,182,0.15); color: #f472b6; }

.nav-numbers { display: flex; flex-wrap: wrap; gap: 5px; }
.nav-num {
  width: 31px; height: 31px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-xs);
  font-size: 11px; font-weight: 600;
  cursor: pointer;
  transition: all var(--transition-fast);
  border: 1px solid var(--glass-border);
  background: rgba(0,0,0,0.03);
  color: var(--text2);
}
.nav-num:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-soft);
}
.nav-num.current {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.nav-num.correct { background: var(--success-soft); color: var(--success); border-color: var(--success-border); }
.nav-num.wrong { background: var(--danger-soft); color: var(--danger); border-color: var(--danger-border); }
.nav-num.starred { box-shadow: 0 0 0 2px #fbbf24; }

/* ===== Question Card (Glass) ===== */
.question-card {
  background: var(--glass-bg);
  border-radius: var(--radius);
  padding: 30px;
  box-shadow: var(--glass-shadow);
  border: 1px solid var(--glass-border);
  /* Performance: promote to compositor layer, avoid paint during scroll */
  transform: translateZ(0);
  will-change: transform, opacity;
  contain: layout style paint;
}
.question-card.anim-enter { animation: cardIn 0.28s cubic-bezier(0.22,1,0.36,1) both; }
.question-card.anim-exit { animation: cardOut 0.15s ease-in both; }
@keyframes cardIn {
  from { opacity: 0; transform: translateZ(0) translateX(28px); }
  to { opacity: 1; transform: translateZ(0) translateX(0); }
}
@keyframes cardOut {
  from { opacity: 1; transform: translateZ(0) translateX(0); }
  to { opacity: 0; transform: translateZ(0) translateX(-28px); }
}
/* GPU layer for quiz container to prevent layout thrash */
.quiz-main { transform: translateZ(0); will-change: transform; }
.quiz-panel { transform: translateZ(0); will-change: transform; }
/* Reduce motion for users who prefer it + battery saving */
@media (prefers-reduced-motion: reduce) {
  .question-card.anim-enter, .question-card.anim-exit { animation: none; }
  * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}

.question-header {
  display: flex; align-items: flex-start; gap: 14px;
  margin-bottom: 22px;
}
.question-badge {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 5px;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  font-size: 12px; font-weight: 700;
  letter-spacing: 0.3px;
}
.question-badge.single { background: rgba(129,140,248,0.15); color: #818cf8; }
.question-badge.multiple { background: rgba(251,191,36,0.15); color: #fbbf24; }
.question-badge.judge { background: rgba(74,222,128,0.15); color: #4ade80; }
.question-badge.fill { background: rgba(167,139,250,0.15); color: #a78bfa; }
.question-badge.drag { background: rgba(244,114,182,0.15); color: #f472b6; }

.question-text {
  font-size: 16px; line-height: 1.75;
  color: var(--text);
  flex: 1;
}
.question-img {
  margin: 18px 0; text-align: center;
}
.question-img img {
  max-width: 100%; max-height: 420px;
  border-radius: var(--radius-sm);
  box-shadow: var(--glass-shadow-sm);
  border: 1px solid var(--glass-border);
}

.star-btn {
  flex-shrink: 0;
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(0,0,0,0.06);
  background: rgba(0,0,0,0.03);
  font-size: 22px; cursor: pointer;
  transition: all var(--transition-fast);
  border-radius: 50%;
  color: rgba(0,0,0,0.2);
}
.star-btn:hover {
  background: rgba(251,191,36,0.15);
  color: #fbbf24;
  border-color: rgba(251,191,36,0.3);
}
.star-btn.active { color: #fbbf24; border-color: rgba(251,191,36,0.3); }

/* ===== Options (Glass) ===== */
.options-list { display: flex; flex-direction: column; gap: 9px; }
.option-item {
  display: flex; align-items: center; gap: 14px;
  padding: 13px 18px;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: none;
  background: rgba(0,0,0,0.03);
  font-size: 15px;
  color: var(--text);
}
.option-item:hover {
  border-color: var(--glass-border-hover);
  background: rgba(0,0,0,0.05);
}
.option-item.selected {
  border-color: var(--primary);
  background: var(--primary-soft);
}
.option-item.correct {
  border-color: var(--success-border);
  background: var(--success-soft);
}
.option-item.wrong {
  border-color: var(--danger-border);
  background: var(--danger-soft);
}

.option-letter {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  font-weight: 700; font-size: 14px;
  flex-shrink: 0;
  background: rgba(0,0,0,0.04);
  color: var(--text2);
  transition: none;
}
.option-item.selected .option-letter { background: var(--primary); color: #fff; }
.option-item.correct .option-letter { background: var(--success); color: var(--dark-text); }
.option-item.wrong .option-letter { background: var(--danger); color: #fff; }

.option-check {
  margin-left: auto;
  font-size: 18px; color: var(--success);
  opacity: 0; transition: none;
}
.option-item.correct .option-check { opacity: 1; }

/* Judge */
.judge-options { display: flex; gap: 14px; }
.judge-btn {
  flex: 1; padding: 16px;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  background: rgba(0,0,0,0.03);
  font-size: 16px; font-weight: 600;
  cursor: pointer; transition: none;
  text-align: center;
  color: var(--text);
}
.judge-btn:hover { border-color: var(--glass-border-hover); background: rgba(0,0,0,0.05); }
.judge-btn.selected { border-color: var(--primary); background: var(--primary-soft); }
.judge-btn.correct { border-color: var(--success-border); background: var(--success-soft); color: var(--success); }
.judge-btn.wrong { border-color: var(--danger-border); background: var(--danger-soft); color: var(--danger); }

/* Fill */
.fill-input {
  width: 100%; padding: 14px 18px;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  font-size: 15px; outline: none;
  transition: none;
  background: rgba(0,0,0,0.03);
  color: var(--text);
}
.fill-input::placeholder { color: var(--text3); }
.fill-input:focus { border-color: var(--primary); }
.fill-input.correct { border-color: var(--success-border); background: var(--success-soft); }
.fill-input.wrong { border-color: var(--danger-border); background: var(--danger-soft); }

/* Drag - Arrow Connection Style */
.drag-section {
  position: relative;
  display: flex;
  gap: 80px;
  margin: 18px 0;
  padding: 20px 0;
}

/* SVG container for arrows */
.drag-arrows-svg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.drag-arrow-line {
  stroke: #CF0A2C;
  stroke-width: 2.5;
  fill: none;
  marker-end: url(#arrowhead);
}

.drag-arrow-line.wrong {
  stroke: #dc2626;
  stroke-dasharray: 6,4;
}

.drag-arrow-line.correct {
  stroke: #16a34a;
}

/* Left side - drag items */
.drag-items {
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex: 1;
  min-width: 180px;
  position: relative;
  z-index: 2;
}

.drag-item {
  position: relative;
  padding: 12px 20px;
  background: var(--card-bg);
  border: 2px solid rgba(207,10,44,0.3);
  border-radius: var(--radius-sm);
  cursor: grab;
  font-size: 14px;
  font-weight: 500;
  transition: all var(--transition-fast);
  user-select: none;
  color: var(--text);
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.drag-item:active { cursor: grabbing; }
.drag-item:hover {
  background: var(--primary-soft);
  border-color: var(--primary);
  transform: translateX(4px);
}
.drag-item.used { opacity: 0.35; cursor: default; transform: none; }
.drag-item.dragging { opacity: 0.4; transform: scale(0.95); }
.drag-item.selected {
  background: var(--primary-soft);
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(207,10,44,0.15);
}
.drag-item.correct-answer {
  border-color: var(--success);
  background: var(--success-soft);
}
.drag-item.wrong-answer {
  border-color: var(--danger);
  background: var(--danger-soft);
}

/* Right side - targets */
.drag-targets {
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex: 1;
  min-width: 200px;
  position: relative;
  z-index: 2;
}

.drag-target {
  position: relative;
  padding: 12px 20px;
  border: 2px solid var(--glass-border);
  border-radius: var(--radius-sm);
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all var(--transition-fast);
  font-size: 14px;
  color: var(--text);
  background: var(--card-bg);
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.drag-target .target-label {
  flex-shrink: 0;
  font-weight: 700;
  color: var(--primary);
  font-size: 13px;
  min-width: 32px;
}

.drag-target .target-text {
  flex: 1;
  line-height: 1.5;
}

.drag-target.over {
  border-color: var(--primary);
  background: var(--primary-soft);
  box-shadow: 0 0 0 3px rgba(207,10,44,0.15);
}
.drag-target.filled {
  border-color: var(--primary);
  background: var(--primary-light);
}
.drag-target.touch-over {
  border-color: var(--primary);
  background: var(--primary-soft);
}
.drag-target.correct {
  border-color: var(--success);
  background: var(--success-soft);
}
.drag-target.wrong {
  border-color: var(--danger);
  background: var(--danger-soft);
}

/* Touch drag clone */
.drag-clone {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.9;
  transform: rotate(2deg);
  box-shadow: 0 8px 32px rgba(207,10,44,0.3);
  padding: 12px 20px;
  background: var(--primary-soft);
  border: 2px solid var(--primary);
  border-radius: var(--radius-sm);
  font-size: 14px;
  white-space: nowrap;
  color: var(--text);
  font-weight: 500;
}

/* Remove button */
.drag-remove {
  margin-left: auto;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.12);
  background: rgba(0,0,0,0.04);
  color: var(--danger);
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all var(--transition-fast);
  line-height: 1;
  flex-shrink: 0;
}
.drag-remove:hover {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
}

/* Mobile responsive */
@media (max-width: 700px) {
  .drag-section {
    flex-direction: column;
    gap: 16px;
  }
  .drag-items {
    order: 2;
    min-width: 100%;
  }
  .drag-targets {
    order: 1;
    min-width: 100%;
  }
  /* On mobile, arrows are drawn vertically */
  .drag-arrows-svg {
    display: none; /* Hide SVG on mobile, use fallback styling */
  }
}

/* ===== Feedback (Glass) ===== */
.feedback-bar {
  margin-top: 18px; padding: 15px 20px;
  border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600;
  display: flex; align-items: center; gap: 12px;
}
.feedback-bar.correct .spring-in { background: var(--success-soft); color: var(--success); border: 1px solid var(--success-border); }
.feedback-bar.wrong { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger-border); }

.feedback-icon { font-size: 22px; }
.explanation-box {
  margin-top: 14px; padding: 18px;
  background: rgba(0,0,0,0.03);
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  font-size: 14px; line-height: 1.75; color: var(--text2);
}

/* ===== Navigation bar ===== */
.quiz-nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 0;
  gap: 10px;
}
.quiz-nav .nav-info { font-size: 14px; font-weight: 500; color: var(--text2); }
.quiz-nav .nav-btns { display: flex; gap: 10px; }

/* ===== Timer bar (Glass + Glow) ===== */
.timer-bar {
  height: 4px;
  background: rgba(0,0,0,0.04);
  border-radius: 2px;
  margin-bottom: 18px;
  overflow: hidden;
}
.timer-text {
  text-align: right; font-size: 12px; font-weight: 700;
  color: var(--text2);
  margin-bottom: 7px;
  letter-spacing: 0.5px;
  transition: color 0.3s;
}
.timer-text.warning { color: #f59e0b; }
.timer-text.danger { color: var(--danger); animation: blink 1s infinite; }

.timer-fill {
  height: 100%;
  background: linear-gradient(90deg, #4ade80, #fbbf24, #f87171);
  border-radius: 2px;
  transition: width 1s linear, background 0.3s;
  box-shadow: 0 0 8px rgba(74,222,128,0.4);
}
.timer-fill.warning { background: linear-gradient(90deg, #fbbf24, #f59e0b); box-shadow: 0 0 8px rgba(245,158,11,0.4); }
.timer-fill.danger { background: linear-gradient(90deg, #f87171, #ef4444); box-shadow: 0 0 8px rgba(239,68,68,0.4); }

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* ===== Modal (Glass) ===== */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
  animation: fadeIn 0.2s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-box {
  background: #ffffff;
  border-radius: var(--radius);
  padding: 32px;
  max-width: 520px; width: 90%;
  box-shadow: 0 16px 48px rgba(0,0,0,0.5);
  border: 1px solid var(--glass-border);
}
.modal-title { font-size: 19px; font-weight: 700; margin-bottom: 18px; color: var(--text); }
.modal-body { font-size: 14px; color: var(--text2); margin-bottom: 24px; line-height: 1.7; }
.modal-actions { display: flex; gap: 12px; justify-content: flex-end; }

/* Answer sheet grid in modal */
.answer-sheet-grid {
  display: flex; flex-wrap: wrap; gap: 7px;
  max-height: 420px; overflow-y: auto;
}

/* ===== Result Page (Glass) ===== */
.result-container {
  max-width: 620px; margin: 28px auto;
  background: var(--glass-bg);
  border-radius: var(--radius);
  padding: 38px;
  box-shadow: var(--glass-shadow);
  text-align: center;
  border: 1px solid var(--glass-border);
}
.result-score {
  font-size: 72px; font-weight: 900;
  color: var(--dark-text);
  line-height: 1;
  margin-bottom: 8px;
}
.result-pass { color: #16a34a; }
.result-fail { color: #dc2626; }
.result-stats { display: flex; gap: 28px; justify-content: center; margin: 24px 0; flex-wrap: wrap; }
.result-stat {
  text-align: center;
  padding: 16px 24px;
  background: rgba(0,0,0,0.03);
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
}
.result-stat .num { font-size: 30px; font-weight: 700; color: var(--text); }
.result-stat .label { font-size: 12px; color: var(--text2); margin-top: 2px; }

.result-type-scores {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 12px;
  margin: 20px 0;
}
.result-type-score {
  padding: 14px 12px;
  background: rgba(0,0,0,0.03);
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  text-align: center;
}
.result-type-score .type-name { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
.result-type-score .type-val { font-size: 20px; font-weight: 700; }

/* ===== Wrong Book (Glass) ===== */
.wrong-book-item {
  padding: 15px 18px;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  cursor: pointer;
  transition: all var(--transition-fast);
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(0,0,0,0.03);
  color: var(--text);
}
.wrong-book-item:hover {
  border-color: var(--primary);
  background: var(--primary-soft);
  transform: translateX(2px);
}

/* ===== Search card ===== */
.search-card {
  display: block;
  padding: 14px 16px;
  margin-bottom: 10px;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  background: var(--glass-bg);
  cursor: pointer;
  transition: all var(--transition-fast);
  animation: pageFadeIn 0.25s ease-out;
}
.search-card:hover {
  border-color: var(--primary);
  background: var(--primary-soft);
  transform: translateX(3px);
  box-shadow: var(--shadow-sm);
}
.search-card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.search-card-body {
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--text);
}
.search-card-tip {
  margin-top: 8px;
  padding: 8px 10px;
  font-size: 12px;
  color: var(--text2);
  background: rgba(0,0,0,0.03);
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--primary);
  line-height: 1.5;
}
[data-theme="dark"] .search-card-tip { background: rgba(255,255,255,0.04); }
/* Prevent hover animations on touch devices */
@media (hover: none) {
  .search-card:hover { transform: none; box-shadow: none; }
}

/* ===== Memorize mode ===== */
.mem-answer-box {
  padding: 22px;
  background: var(--success-soft);
  border-radius: var(--radius-sm);
  border: 1px solid var(--success-border);
  margin-top: 18px;
  color: var(--success);
}
.highlight {
  background: rgba(251,191,36,0.2);
  padding: 2px 8px;
  border-radius: 4px;
  color: #fbbf24;
  font-weight: 600;
}

/* ===== Saves List ===== */
.saves-item {
  padding: 15px 18px;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(0,0,0,0.03);
  transition: all var(--transition-fast);
  color: var(--text);
}
.saves-item:hover { border-color: var(--glass-border-hover); background: rgba(0,0,0,0.05); }

/* ===== Filter Tabs ===== */
.filter-tabs {
  display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
}
.filter-tab {
  padding: 7px 16px;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-full);
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  transition: all var(--transition-fast);
  background: rgba(0,0,0,0.03);
  color: var(--text2);
}
.filter-tab:hover { border-color: var(--glass-border-hover); color: var(--text); }
.filter-tab.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 2px 12px var(--primary-glow);
}

/* ===== Keyboard hints ===== */
.kbd-hint {
  position: fixed; bottom: 20px; right: 20px;
  background: rgba(0,0,0,0.78);
  color: rgba(255,255,255,0.88);
  padding: 9px 16px;
  border-radius: var(--radius-full);
  font-size: 11px;
  opacity: 0.85;
  pointer-events: none;
  transition: opacity 0.5s;
  border: 1px solid rgba(255,255,255,0.10);
  z-index: 100;
}
.kbd-hint kbd {
  background: rgba(255,255,255,0.14);
  padding: 2px 7px;
  border-radius: 4px;
  font-family: monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.92);
}

/* ===== Section Titles ===== */
.section-title {
  font-size: 20px; font-weight: 700;
  margin-bottom: 18px;
  color: var(--text);
}

/* ===== Exam History Detail ===== */
.exam-detail-container {
  max-width: 700px; margin: 24px auto;
}
.exam-detail-card {
  background: var(--glass-bg);
  border-radius: var(--radius);
  padding: 28px;
  box-shadow: var(--glass-shadow);
  border: 1px solid var(--glass-border);
  margin-bottom: 18px;
}
.exam-detail-question {
  padding: 18px;
  background: rgba(0,0,0,0.03);
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  margin-bottom: 12px;
}
.exam-detail-question .user-answer { color: var(--danger); font-weight: 600; }
.exam-detail-question .correct-answer { color: var(--success); font-weight: 600; }

/* ===== Empty state ===== */
.empty-state {
  text-align: center; padding: 48px 20px;
  color: var(--text2);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.empty-state p { font-size: 14px; }

/* Back link */
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 14px; font-weight: 600;
  color: var(--text2);
  cursor: pointer;
  margin-bottom: 18px;
  transition: color var(--transition-fast);
  background: none; border: none;
  padding: 0;
}
.back-link:hover { color: var(--primary); }

/* ===== Responsive (Glass stays) ===== */
@media (max-width: 768px) {
  #app { padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  .header { padding: 22px 12px 18px; padding-top: calc(22px + env(safe-area-inset-top)); }
  .header h1 { font-size: 22px; }
  .home-stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat-card { padding: 12px; gap: 8px; }
  .stat-card .stat-icon { width: 30px; height: 30px; font-size: 13px; }
  .stat-card .stat-num { font-size: 18px; }
  .home-core { grid-template-columns: 1fr; gap: 14px; }
  .home-tools { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .core-card { padding: 20px; min-height: auto; }
  .tool-card { padding: 14px 10px; }
  .tool-card .tool-icon { width: 34px; height: 34px; font-size: 15px; }

<script>
const AppState = {
    currentView: 'home',          // home | config | practice-config | quiz | result | wrongbook | memorizemode
    quizMode: '',                  // 'exam' | 'practice-random' | 'practice-sequential'
    examQuestions: [],

    examConfig: {},
    examTimeLeft: 5400,            // seconds, default 90 min
    examStartTime: 0,
    examTotalScore: 1000,
    examPassScore: 600,
    examTimeLimit: 90,             // minutes, 0 = unlimited
    currentIdx: 0,
    pendingGoToTimeout: null,
    userAnswers: {},             // { idx: answer }

    favorites: new Set(),
    wrongCounts: {},

    currentSubject: '821',       // 当前科目
    autoSaveInterval: null,
    fromSearch: false,
    lastSearchQuery: '',
};

// ============ Subject Configuration ============
const SUBJECTS = {
    '821': {
        id: '821',
        name: '821 - 核心技术',
        shortName: '核心技术',
        subtitle: 'HCIP-Datacom-Core Technology',
        code: 'H12-821',
        color: '#CF0A2C',

        typeCounts: { single: 168, multiple: 143, judge: 134, fill: 21, drag: 20 },

    '831': {
        id: '831',
        name: '高级路由与交换',
        shortName: '高级路由与交换',
        subtitle: 'HCIP-Datacom-Advanced Technology',
        code: 'H12-831',
        color: '#1a73e8',
        pdf: 'H12-831.pdf',
        typeCounts: { single: 112, multiple: 116, judge: 115, fill: 18, drag: 20 },
        defaultConfig: { single: 112, multiple: 116, judge: 115, fill: 18, drag: 20 }
    },
};


// ============ Storage Keys (per-subject) ============
// 获取当前科目的存储键（按科目隔离数据）
function getKey(key) {
    const prefix = 'hcip_' + AppState.currentSubject;
    const keys = {
        saves: prefix + '_saves',
        wrong: prefix + '_wrong',
        favorites: prefix + '_favorites',
        wrongCounts: prefix + '_wrong_counts',
        examHistory: prefix + '_exam_history'
    };
    return keys[key] || key;
}
// 全局统计键（跨科目汇总）
const STORAGE_KEY_GLOBAL_STATS = 'hcip_global_stats';
const STORAGE_KEY_SUBJECT = 'hcip_current_subject';


// 获取当前科目的存储键前缀
// 动态生成存储键
const TYPE_LABELS = { single: '单选题', multiple: '多选题', judge: '判断题', fill: '填空题', drag: '拖拽题' };
const TYPE_COLORS = { single: 'single', multiple: 'multiple', judge: 'judge', fill: 'fill', drag: 'drag' };


// 获取当前科目的题目数量
function getTypeCounts() {
    return SUBJECTS[AppState.currentSubject]?.typeCounts || { single: 0, multiple: 0, judge: 0, fill: 0, drag: 0 };
}

// 获取当前科目的默认配置
function getDefaultConfig() {
    return SUBJECTS[AppState.currentSubject]?.defaultConfig || { single: 0, multiple: 0, judge: 0, fill: 0, drag: 0 };
}

// 获取当前科目的题目总数
function getTotalQuestions() {
    const tc = SUBJECTS[AppState.currentSubject]?.typeCounts || { single: 0, multiple: 0, judge: 0, fill: 0, drag: 0 };
    return Object.values(tc).reduce((a, b) => a + b, 0);
}

// ============ Init ============
(function init() {
    // 加载上次科目
    const savedSubject = localStorage.getItem(STORAGE_KEY_SUBJECT);
    if (savedSubject && SUBJECTS[savedSubject]) {
        AppState.currentSubject = savedSubject;
    }

// ============ Storage ============
function saveProgress(mode, questions, idx, answers, submitted, config, timeLeft) {
    const data = { mode, questions, currentIdx: idx, answers, submitted, config, timeLeft, savedAt: Date.now() };
    let saves = getAllSaves();
    // Update existing save with same mode, or add new
    const existingIdx = saves.findIndex(s => s.mode === mode);
    if (existingIdx >= 0) {
        saves[existingIdx] = data;
    } else {
        saves.unshift(data);
        if (saves.length > 20) saves = saves.slice(0, 20);
    }
    localStorage.setItem(getKey('saves'), JSON.stringify(saves));
}
function getAllSaves() {
    try { return JSON.parse(localStorage.getItem(getKey('saves'))) || []; } catch(e) { return []; }
}
function deleteSave(index) {
    let saves = getAllSaves();
    saves.splice(index, 1);
    localStorage.setItem(getKey('saves'), JSON.stringify(saves));
}
function clearProgress() { localStorage.removeItem(getKey('saves')); }
function hasProgress() { return getAllSaves().length > 0; }

function getWrongBookIds() {
    try { return JSON.parse(localStorage.getItem(getKey('wrong'))) || []; } catch(e) { return []; }
}
function addToWrongBook(qid) {
    const arr = getWrongBookIds();
    if (!arr.includes(qid)) { arr.push(qid); }
    localStorage.setItem(getKey('wrong'), JSON.stringify(arr));
}
function removeFromWrongBook(qid) {
    const arr = getWrongBookIds().filter(x => x !== qid);
    localStorage.setItem(getKey('wrong'), JSON.stringify(arr));
}

function loadFavorites() {
    try { AppState.favorites = new Set(JSON.parse(localStorage.getItem(getKey('favorites'))) || []); } catch(e) { AppState.favorites = new Set(); }
}
function saveFavorites() { localStorage.setItem(getKey('favorites'), JSON.stringify([...AppState.favorites])); }
function toggleFavorite(qid) {
    if (AppState.favorites.has(qid)) { AppState.favorites.delete(qid); } else { AppState.favorites.add(qid); }
    saveFavorites();
    return AppState.favorites.has(qid);
}

function loadWrongCounts() {
    try { AppState.wrongCounts = JSON.parse(localStorage.getItem(getKey('wrongCounts'))) || {}; } catch(e) { AppState.wrongCounts = {}; }
}
function incrementWrongCount(qid) {
    AppState.wrongCounts[qid] = (AppState.wrongCounts[qid] || 0) + 1;
    localStorage.setItem(getKey('wrongCounts'), JSON.stringify(AppState.wrongCounts));
}

function getProgressSummary() {
    const saves = getAllSaves();
    if (saves.length === 0) return null;
    // Return the most recent save
    const p = saves[0];
    const answered = (p.questions || []).reduce((cnt, q, j) => cnt + (hasUserAnswered((p.answers || {})[j], q) ? 1 : 0), 0);
    const modeLabel = p.mode === 'exam' ? '考试' : (p.mode === 'practice-random' ? '乱序练习' : '顺序练习');
    const d = new Date(p.savedAt);
    const timeLabel = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    return { mode: p.mode, label: modeLabel, total: p.questions.length, answered, idx: p.currentIdx || 0, savedAt: p.savedAt, timeLabel, index: 0 };
}

// ============ Select questions ============
function selectQuestionsByType(config, pool, doShuffle) {
    const selected = [];
    const typeMap = { single: [], multiple: [], judge: [], fill: [], drag: [] };
    pool.forEach(q => { if (typeMap[q.type]) typeMap[q.type].push(q); });
    for (const [type, count] of Object.entries(config)) {
        if (count <= 0) continue;
        const pool2 = typeMap[type] || [];
        if (pool2.length === 0) continue;
        const n = Math.min(count, pool2.length);
        const indices = doShuffle ? shuffle([...Array(pool2.length).keys()]) : [...Array(pool2.length).keys()];
        for (let i = 0; i < n; i++) selected.push(pool2[indices[i]]);
    }
    return selected;
}

function shuffleOptions(q) {
    if (q.type === 'fill' || q.type === 'drag') return q;
    if (!q.options || q.options.length < 2) return q;
    const indices = [...Array(q.options.length).keys()];
    const shuffled = shuffle(indices);
    const newOpts = shuffled.map(i => q.options[i]);
    const newAnswer = q.answer.map(a => shuffled.indexOf(a)).sort((a,b)=>a-b);
    return { ...q, options: newOpts, answer: newAnswer };
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

        }

}

// ============ Subject Switching ============
function switchSubject(subjectId) {
    if (!SUBJECTS[subjectId]) return;
    
    const app = document.getElementById('app');
    
    // Phase 1: Exit animation
    app.classList.add('subject-exit');
    
    const doSwitch = () => {
        // Phase 2: Switch data
        AppState.currentSubject = subjectId;
        localStorage.setItem(STORAGE_KEY_SUBJECT, subjectId);
        // 切换科目时重新加载该科目的数据
        AppState.favorites = new Set();
        AppState.wrongCounts = {};
        AppState.examConfig = Object.assign({}, getDefaultConfig());
        loadFavorites();
        loadWrongCounts();
        // 清空当前进度
        AppState.userAnswers = {};
        AppState.submittedFlags = {};
        AppState.examQuestions = [];
        AppState.currentIdx = 0;
        AppState.currentView = 'home';
        
        // Phase 3: Render + enter animation
        const afterRender = () => {
            app.classList.remove('subject-exit');
            app.classList.add('subject-enter');
            setTimeout(() => app.classList.remove('subject-enter'), 400);
            showToast('已切换至 ' + SUBJECTS[subjectId].name);
        };
        
        // 831数据加载（如果尚未加载）
        if (subjectId === '831' && typeof QUIZ_DATA_H12_831 === 'undefined') {
            loadScript('H12-831/quiz_data_h12_831.js', function() {
                render();
                afterRender();
            });
            return;
        }
        render();
        afterRender();
    };
    
    setTimeout(doSwitch, 190);
}

function renderTypeSlidersBody() {
    const counts = getTypeCounts();
    const types = [
        { key: 'single', label: '单选题', cls: 'single' },
        { key: 'multiple', label: '多选题', cls: 'multiple' },
        { key: 'judge', label: '判断题', cls: 'judge' },
        { key: 'fill', label: '填空题', cls: 'fill' },
        { key: 'drag', label: '拖拽题', cls: 'drag' },
    ];
    return types.map(t => {
        const max = counts[t.key] || 0;
        const val = AppState.examConfig[t.key] || 0;
        return `
    <div class="config-type-row">
      <span class="config-type-label">${t.label} <span class="config-type-avail">(共${max}题)</span></span>
      <input type="range" class="config-type-slider" min="0" max="${max}" value="${val}"
        oninput="syncSliderInput('${t.key}', this.value, true)"
        onchange="syncSliderInput('${t.key}', this.value, false);render();">
      <input type="number" class="config-type-input" id="cfg-${t.key}" min="0" max="${max}" value="${val}"
        onchange="syncSliderInput('${t.key}', this.value, false);render();">
    </div>`;
    }).join('');
}

function syncSliderInput(key, value, fromSlider) {
    const num = parseInt(value) || 0;
    const max = getTypeCounts()[key];
    const clamped = Math.max(0, Math.min(num, max));
    AppState.examConfig[key] = clamped;
    const inp = document.getElementById('cfg-' + key);
    if (inp) inp.value = clamped;

    // Bounds guard: prevent out-of-range values from config slider
    const ranges = {quiz_count:[5,200],multi_count:[0,100],judge_count:[0,100],fill_count:[0,50],drag_count:[0,30]};
    if (ranges[key] && (num < ranges[key][0] || num > ranges[key][1])) return;
}
// ============ Begin ============
function beginExam() {
  try {
    const total = Object.values(AppState.examConfig).reduce((a,b)=>a+b,0);
    if (total === 0) { alert('请至少选择一道题目。'); return; }
    const selected = selectQuestionsByType(AppState.examConfig, getQuizData(), true);
    shuffle(selected);
    AppState.examQuestions = selected.map(q => shuffleOptions(q));
    AppState.examTimeLeft = AppState.examTimeLimit > 0 ? AppState.examTimeLimit * 60 : 999999;
    AppState.examStartTime = Date.now();
    AppState.currentIdx = 0;
    AppState.userAnswers = {};
    AppState.submittedFlags = {};
    // Initialize drag answers
    AppState.examQuestions.forEach((q, i) => {
        if (q.type === 'drag') AppState.userAnswers[i] = new Array((q.dragTargets || []).length).fill(-1);
    });
    AppState.currentView = 'quiz';
    saveProgress(AppState.quizMode, AppState.examQuestions, 0, AppState.userAnswers, {}, AppState.examConfig, AppState.examTimeLeft);
    render();
    startAutoSave();
    if (AppState.examTimeLimit > 0) startTimer();
  } catch(e) {
    console.error('beginExam error:', e);
    alert('启动考试时出错，请刷新页面重试。错误信息：' + e.message);
  }
}

function beginPractice() {
  try {
    const total = Object.values(AppState.examConfig).reduce((a,b)=>a+b,0);
    if (total === 0) { alert('请至少选择一道题目。'); return; }
    const doShuffle = AppState.quizMode === 'practice-random';
    const selected = selectQuestionsByType(AppState.examConfig, getQuizData(), doShuffle);
    if (doShuffle) {
        shuffle(selected);
        AppState.examQuestions = selected.map(q => shuffleOptions(q));
    } else {
        AppState.examQuestions = selected;
    }
    AppState.currentIdx = 0;
    AppState.userAnswers = {};
    AppState.submittedFlags = {};
    // Initialize drag answers
    AppState.examQuestions.forEach((q, i) => {
        if (q.type === 'drag') AppState.userAnswers[i] = new Array((q.dragTargets || []).length).fill(-1);
    });
    AppState.currentView = 'quiz';
    saveProgress(AppState.quizMode, AppState.examQuestions, 0, {}, {}, AppState.examConfig, 0);
    render();
  } catch(e) {
    console.error('beginPractice error:', e);
    alert('启动练习时出错，请刷新页面重试。错误信息：' + e.message);

}

function resumeProgress(saveIdx) {
    const saves = getAllSaves();
    const idx = (saveIdx !== undefined) ? saveIdx : 0;
    const p = saves[idx];
    if (!p) return;
    AppState.quizMode = p.mode;
    AppState.examQuestions = p.questions;
    AppState.currentIdx = p.currentIdx || 0;
    AppState.userAnswers = p.answers || {};
    AppState.submittedFlags = p.submitted || {};
    AppState.examConfig = p.config || AppState.examConfig;
    if (AppState.quizMode === 'exam') {
        AppState.examTimeLeft = p.timeLeft || 5400;
        AppState.examStartTime = Date.now();
        if (AppState.examTimeLimit > 0 && AppState.examTimeLeft > 0) startTimer();
    }
    AppState.currentView = 'quiz';
    render();
}

// ============ Timer ============
function startTimer() {
    clearInterval(AppState.timerInterval);
    AppState.timerInterval = setInterval(() => {
        AppState.examTimeLeft--;
        updateTimerDisplay();
        if (AppState.examTimeLeft <= 0) {
            clearInterval(AppState.timerInterval);
            alert('考试时间到！系统将自动交卷。');
            submitExam();
        }
    }, 1000);
}

function updateTimerDisplay() {
    const el = document.getElementById('timer-bar-fill');
    const tel = document.getElementById('timer-text');
    if (!el || !tel) return;
    const total = AppState.examTimeLimit * 60;
    const pct = total > 0 ? (AppState.examTimeLeft / total) * 100 : 100;
    el.style.width = pct + '%';
    const m = Math.floor(AppState.examTimeLeft / 60);
    const s = AppState.examTimeLeft % 60;
    tel.textContent = '⏰ ' + m + ':' + String(s).padStart(2,'0');
    
    // 移除所有状态类
    tel.classList.remove('warning', 'danger', 'blink');
    el.classList.remove('warning', 'danger');
    
    // 剩余10分钟：变黄
    if (AppState.examTimeLeft <= 600 && AppState.examTimeLeft > 300) {
        tel.classList.add('warning');
        el.classList.add('warning');
    }
    // 剩余5分钟：变红
    else if (AppState.examTimeLeft <= 300 && AppState.examTimeLeft > 60) {
        tel.classList.add('danger');
        el.classList.add('danger');
    }
    // 剩余1分钟：闪烁+变红
    else if (AppState.examTimeLeft <= 60) {
        tel.classList.add('danger', 'blink');
        el.classList.add('danger');
        // 最后10秒每2秒提醒一次
        if (AppState.examTimeLeft <= 10 && AppState.examTimeLeft % 2 === 0) {
            showToast('⏰ 剩余 ' + AppState.examTimeLeft + ' 秒！', 1500);
        }
    }
}

function renderQuestionContent(q, idx, isMemorize, isSubmitted, ans) {
    const qNum = idx + 1;
    const typeLabel = TYPE_LABELS[q.type];
    const typeCls = TYPE_COLORS[q.type];
    const isStarred = AppState.favorites.has(q.id);

    let html = `
      <div class="question-header">
        <span class="question-badge ${typeCls}">${typeLabel}</span>
        <span class="question-text">${qNum}. ${q.question}</span>
        <button class="star-btn${isStarred?' active':''}" onclick="starQuestion(${q.id}, this)" title="收藏/取消收藏">${isStarred ? '&#9733;' : '&#9734;'}</button>
      </div>`;

    if (q.questionImage) {
        html += `<div class="question-img"><img src="${q.questionImage}" alt="题图" loading="lazy" onerror="this.outerHTML='<div style=&quot;padding:24px;text-align:center;color:var(--text3);background:rgba(0,0,0,0.03);border-radius:12px;border:1px dashed var(--glass-border)&quot;>📷 图片加载失败</div>'"></div>`;
    }

    // Options
    if (q.type === 'single') {
        const letters = ['A','B','C','D','E','F','G','H'];
        html += '<div class="options-list">';
        (q.options || []).forEach((opt, i) => {
            let cls = '';
            if (isMemorize) {
                cls = q.answer.includes(i) ? 'correct' : '';
            } else if (isSubmitted) {
                const userSel = Array.isArray(ans) ? ans.includes(i) : ans === i;
                const correct = q.answer.includes(i);
                if (correct) cls = 'correct';
                else if (userSel) cls = 'wrong';
            } else if (Array.isArray(ans) ? ans.includes(i) : ans === i) {
                cls = 'selected';
            }
            html += `
            <div class="option-item ${cls}" onclick="${isMemorize||isSubmitted?'':('selectSingle('+i+')')}">
              <span class="option-letter">${letters[i]}</span>
              <span>${opt}</span>
              <span class="option-check">&#10003;</span>
            </div>`;
        });
        html += '</div>';
    } else if (q.type === 'multiple') {
        const letters = ['A','B','C','D','E','F','G','H'];
        html += '<div class="options-list">';
        (q.options || []).forEach((opt, i) => {
            let cls = '';
            if (isMemorize) {
                cls = q.answer.includes(i) ? 'correct' : '';
            } else if (isSubmitted) {
                const userSel = (ans || []).includes(i);
                const correct = q.answer.includes(i);
                if (correct) cls = 'correct';
                else if (userSel) cls = 'wrong';
            } else if ((ans || []).includes(i)) {
                cls = 'selected';
            }
            html += `
            <div class="option-item ${cls}" onclick="${isMemorize||isSubmitted?'':('toggleMulti('+i+')')}">
              <span class="option-letter">${letters[i]}</span>
              <span>${opt}</span>
              <span class="option-check">&#10003;</span>
            </div>`;
        });
        html += '</div>';
    } else if (q.type === 'judge') {
        const labels = ['正确', '错误'];
        const vals = [0, 1];
        html += '<div class="judge-options">';
        vals.forEach((v, i) => {
            let cls = '';
            if (isMemorize) {
                cls = q.answer.includes(v) ? 'correct' : '';
            } else if (isSubmitted) {
                if (q.answer.includes(v)) cls = 'correct';
                else if (ans === v) cls = 'wrong';
            } else if (ans === v) {
                cls = 'selected';
            }
            html += `<div class="judge-btn ${cls}" onclick="${isMemorize||isSubmitted?'':('selectJudge('+v+')')}">${labels[i]}</div>`;
        });
        html += '</div>';
    } else if (q.type === 'fill') {
        const userVal = ans || '';
        const showResult = isMemorize || isSubmitted;
        let cls = '';
        if (showResult) {
            const correct = q.answer[0] || '';
            cls = (userVal.trim() === correct.trim()) ? 'correct' : 'wrong';
        }
        html += `<div style="margin-top:12px">
          <input class="fill-input ${cls}" type="text" placeholder="输入答案" value="${userVal}" ${showResult?'readonly':''} onchange="selectFill(this.value)">
          ${showResult ? `<div class="feedback-bar ${cls==='correct'?'correct spring-in':'wrong spring-shake'}"><span class="feedback-icon">${cls==='correct'?'&#10004;':'&#10008;'}</span> 正确答案：${q.answer[0]}</div>` : ''}
        </div>`;
    } else if (q.type === 'drag') {
        html += renderDragContent(q, isMemorize, isSubmitted, ans);
    }

    // Explanation / memorization display
    if (isMemorize) {
        html += `<div class="mem-answer-box">
          <strong>正确答案：</strong>${getCorrectAnswerText(q)}<br><br>
          <strong>解析：</strong>${q.explanation || '暂无解析'}
        </div>`;
        if (q.explanationImage) {
            html += `<div class="question-img"><img src="${q.explanationImage}" alt="解析图" loading="lazy" onerror="this.outerHTML='<div style=&quot;padding:24px;text-align:center;color:var(--text3);background:rgba(0,0,0,0.03);border-radius:12px;border:1px dashed var(--glass-border)&quot;>📷 图片加载失败</div>'"></div>`;
        }
    } else if (isSubmitted) {
        const correct = isAnswerCorrect(idx);
        html += practiceFeedbackHTML(correct, q);
    }

    return html;
}

function renderDragContent(q, isMemorize, isSubmitted, ans) {
    const readonly = isMemorize || isSubmitted;
    const targets = q.dragTargets || [];
    const items = q.dragItems || [];
    const correct = q.dragAnswer || [];
    
    // Build current user answers map: targetIndex -> itemIndex
    const userMap = {};
    if (ans && Array.isArray(ans)) {
        ans.forEach((v, i) => { if (v >= 0) userMap[i] = v; });
    }
    
    const qid = q.id;
    let html = '<div class="drag-section" data-qid="' + qid + '">';
    
    // SVG layer for arrows (will be drawn by JS after render)
    html += '<svg class="drag-arrows-svg"><defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#CF0A2C"/></marker></defs></svg>';
    
    // === Items (LEFT side) ===
    html += '<div class="drag-items">';
    items.forEach((item, ii) => {
        let usedOn = [];
        let stateClass = '';
        
        if (readonly) {
            // In readonly mode, check if this item is the correct answer for any target
            const isCorrectAnswer = correct.includes(ii);
            const wasUserAnswer = Object.values(userMap).includes(ii);
            
            // Check if user got it right (item placed correctly)
            let userGotItRight = false;
            for (let ti = 0; ti < targets.length; ti++) {
                if (userMap[ti] === ii && correct[ti] === ii) userGotItRight = true;
            }
            
            if (userGotItRight) {
                stateClass = ' correct-answer';
            } else if (wasUserAnswer && !userGotItRight) {
                stateClass = ' wrong-answer';
            } else if (isCorrectAnswer && !wasUserAnswer) {
                stateClass = ' correct-answer'; // Show correct answers even if user didn't select
            }
        } else {
            // In interactive mode, check if item is used
            for (let ti = 0; ti < targets.length; ti++) {
                if (userMap[ti] === ii) usedOn.push(ti);
            }
            if (usedOn.length > 0) stateClass = ' used';
        }
        
        html += '<div class="drag-item' + stateClass + '" data-item="' + ii + '"';
        html += ' draggable="' + (readonly ? 'false' : 'true') + '"';
        html += ' data-used-on="' + usedOn.join(',') + '">';
        html += '<span class="item-label">(' + String.fromCharCode(65 + ii) + ')</span> ';
        html += '<span class="item-text">' + item + '</span>';
        html += '</div>';
    });
    html += '</div>';
    
    // === Targets (RIGHT side) ===
    html += '<div class="drag-targets">';
    targets.forEach((t, ti) => {
        const correctItemIdx = correct[ti] !== undefined ? correct[ti] : -1;
        const userItemIdx = userMap[ti] !== undefined ? userMap[ti] : -1;
        
        let stateClass = '';
        if (readonly) {
            if (userItemIdx >= 0 && userItemIdx === correctItemIdx) {
                stateClass = ' correct';
            } else if (userItemIdx >= 0 && userItemIdx !== correctItemIdx) {
                stateClass = ' wrong';
            }
        } else {
            if (userItemIdx >= 0) stateClass = ' filled';
        }
        
        html += '<div class="drag-target' + stateClass + '" data-target="' + ti + '" data-correct-idx="' + correctItemIdx + '">';
        html += '<span class="target-label">(' + (ti + 1) + ')</span>';
        html += '<span class="target-text">' + t + '</span>';
        
        // Show user's answer
        if (userItemIdx >= 0) {
            html += '<span class="user-answer-tag" style="flex-shrink:0;margin-left:auto;padding:3px 10px;background:var(--primary);color:#fff;border-radius:4px;font-size:12px;font-weight:600">' + String.fromCharCode(65 + userItemIdx) + '</span>';
            if (!readonly) {
                html += '<button class="drag-remove" data-target="' + ti + '" title="移除">&times;</button>';
            }
        }
        
        // In readonly, show correct answer if user was wrong or didn't answer
        if (readonly && userItemIdx !== correctItemIdx && correctItemIdx >= 0) {
            html += '<span class="correct-answer-tag" style="flex-shrink:0;margin-left:8px;padding:3px 10px;background:var(--success);color:#fff;border-radius:4px;font-size:12px;font-weight:600">正确: ' + String.fromCharCode(65 + correctItemIdx) + '</span>';
        }
        
        html += '</div>';
    });
    html += '</div>';
    
    html += '</div>';
    return html;
}


function initDragListeners() {
    const dragSection = document.querySelector('.drag-section');
    if (!dragSection || dragSection.dataset.init) return;
    dragSection.dataset.init = '1';
    
    const items = dragSection.querySelectorAll('.drag-item');
    const targets = dragSection.querySelectorAll('.drag-target');
    const removeBtns = dragSection.querySelectorAll('.drag-remove');
    
    let draggedItem = null;
    let touchClone = null;
    
    // Draw arrows after a short delay to ensure DOM is ready
    setTimeout(() => drawDragArrows(), 50);
    
    // === Mouse Drag ===
    items.forEach(item => {
        item.addEventListener('dragstart', function(e) {
            draggedItem = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.dataset.item);
            setTimeout(() => { if (this.classList.contains('dragging')) this.style.opacity = '0.4'; }, 0);
        });
        item.addEventListener('dragend', function(e) {
            this.classList.remove('dragging');
            this.style.opacity = '';
            draggedItem = null;
        });
    });
    
    targets.forEach(target => {
        target.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            this.classList.add('over');
        });
        target.addEventListener('dragleave', function(e) {
            this.classList.remove('over');
        });
        target.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('over');
            const itemIdx = parseInt(e.dataTransfer.getData('text/plain'));
            const targetIdx = parseInt(this.dataset.target);
            if (!isNaN(itemIdx) && !isNaN(targetIdx)) {
                placeItem(itemIdx, targetIdx);
            }
        });
    });
    
    // === Touch Drag ===
    items.forEach(item => {
        item.addEventListener('touchstart', function(e) {
            if (e.touches.length !== 1) return;
            draggedItem = this;
            const touch = e.touches[0];
            touchClone = this.cloneNode(true);
            touchClone.classList.add('drag-clone');
            touchClone.style.left = (touch.clientX - 50) + 'px';
            touchClone.style.top = (touch.clientY - 20) + 'px';
            document.body.appendChild(touchClone);
            this.classList.add('dragging');
            this.style.opacity = '0.4';
            e.preventDefault();
        });
        item.addEventListener('touchmove', function(e) {
            if (!touchClone) return;
            const touch = e.touches[0];
            touchClone.style.left = (touch.clientX - 50) + 'px';
            touchClone.style.top = (touch.clientY - 20) + 'px';
            // Highlight target under finger
            const elem = document.elementFromPoint(touch.clientX, touch.clientY);
            targets.forEach(t => { t.classList.remove('touch-over'); });
            if (elem) {
                const target = elem.closest('.drag-target');
                if (target) target.classList.add('touch-over');
            }
            e.preventDefault();
        });
        item.addEventListener('touchend', function(e) {
            if (touchClone) {
                const touch = e.changedTouches[0];
                const elem = document.elementFromPoint(touch.clientX, touch.clientY);
                if (elem) {
                    const target = elem.closest('.drag-target');
                    if (target) {
                        const itemIdx = parseInt(draggedItem.dataset.item);
                        const targetIdx = parseInt(target.dataset.target);
                        if (!isNaN(itemIdx) && !isNaN(targetIdx)) {
                            placeItem(itemIdx, targetIdx);
                        }
                    }
                }
                document.body.removeChild(touchClone);
                touchClone = null;
            }
            if (draggedItem) {
                draggedItem.classList.remove('dragging');
                draggedItem.style.opacity = '';
                draggedItem = null;
            }
            targets.forEach(t => { t.classList.remove('touch-over'); });
        });
    });
    
    // === Remove buttons ===
    removeBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            const targetIdx = parseInt(this.dataset.target);
            removeFromTarget(targetIdx);
        });
    });
}

function placeItem(itemIdx, targetIdx) {
    const q = AppState.examQuestions[AppState.currentIdx];
    if (!q) return;
    if (!AppState.userAnswers[AppState.currentIdx] || !Array.isArray(AppState.userAnswers[AppState.currentIdx])) {
        AppState.userAnswers[AppState.currentIdx] = new Array((q.dragTargets || []).length).fill(-1);
    }
    AppState.userAnswers[AppState.currentIdx][targetIdx] = itemIdx;
    saveProgressState();
    // Re-render just the drag area
    const questionCard = document.getElementById('question-card');
    if (questionCard) {
        const q2 = AppState.examQuestions[AppState.currentIdx];
        const isSubmitted = AppState.submittedFlags[AppState.currentIdx] || false;
        const isMemorize = AppState.quizMode === 'memorize';
        const ans = AppState.userAnswers[AppState.currentIdx];
        questionCard.innerHTML = renderQuestionContent(q2, AppState.currentIdx, isMemorize, isSubmitted, ans);
        initDragListeners();
    }
}

function drawDragArrows() {
    const dragSection = document.querySelector('.drag-section');
    if (!dragSection) return;
    
    const svg = dragSection.querySelector('.drag-arrows-svg');
    if (!svg) return;
    
    // Clear existing arrows
    const existingArrows = svg.querySelectorAll('.drag-arrow-line');
    existingArrows.forEach(a => a.remove());
    
    const items = dragSection.querySelectorAll('.drag-item');
    const targets = dragSection.querySelectorAll('.drag-target');
    
    if (items.length === 0 || targets.length === 0) return;
    
    // Check if this is mobile (arrows hidden)
    const computedStyle = window.getComputedStyle(svg);
    if (computedStyle.display === 'none') return;
    
    const sectionRect = dragSection.getBoundingClientRect();
    
    // Get current question data
    const qid = dragSection.dataset.qid;
    const q = AppState.examQuestions.find(eq => eq.id == qid) || AppState.examQuestions[AppState.currentIdx];
    if (!q) return;
    
    const correct = q.dragAnswer || [];
    const userAns = AppState.userAnswers[AppState.currentIdx] || [];
    const isSubmitted = AppState.submittedFlags[AppState.currentIdx] || false;
    const isMemorize = AppState.quizMode === 'memorize';
    const readonly = isMemorize || isSubmitted;
    
    // Build position maps
    const itemPositions = [];
    items.forEach((item, idx) => {
        const rect = item.getBoundingClientRect();
        itemPositions[idx] = {
            right: rect.right - sectionRect.left,
            centerY: rect.top + rect.height/2 - sectionRect.top
        };
    });
    
    const targetPositions = [];
    targets.forEach((target, idx) => {
        const rect = target.getBoundingClientRect();
        targetPositions[idx] = {
            left: rect.left - sectionRect.left,
            centerY: rect.top + rect.height/2 - sectionRect.top
        };
    });
    
    // Draw arrows for correct answers (in readonly mode)
    if (readonly) {
        // Draw arrows from each item to its target
        correct.forEach((itemIdx, targetIdx) => {
            if (itemIdx < 0 || itemIdx >= itemPositions.length) return;
            if (targetIdx >= targetPositions.length) return;
            
            const itemPos = itemPositions[itemIdx];
            const targetPos = targetPositions[targetIdx];
            
            if (!itemPos || !targetPos) return;
            
            const userItemIdx = userAns[targetIdx];
            const isUserCorrect = userItemIdx === itemIdx;
            const isUserWrong = userItemIdx >= 0 && userItemIdx !== itemIdx;
            
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            
            // Create curved path
            const startX = itemPos.right + 5;
            const startY = itemPos.centerY;
            const endX = targetPos.left - 5;
            const endY = targetPos.centerY;
            
            // Calculate control points for a nice curve
            const midX = (startX + endX) / 2;
            const d = 'M ' + startX + ' ' + startY + ' C ' + midX + ' ' + startY + ', ' + midX + ' ' + endY + ', ' + endX + ' ' + endY;
            
            line.setAttribute('d', d);
            line.classList.add('drag-arrow-line');
            
            if (isUserCorrect) {
                line.classList.add('correct');
            } else if (isUserWrong) {
                // Draw user's wrong answer too
                const wrongLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const wrongItemPos = itemPositions[userItemIdx];
                if (wrongItemPos) {
                    const wrongStartX = wrongItemPos.right + 5;
                    const wrongStartY = wrongItemPos.centerY;
                    const wrongMidX = (wrongStartX + endX) / 2;
                    const wrongD = 'M ' + wrongStartX + ' ' + wrongStartY + ' C ' + wrongMidX + ' ' + wrongStartY + ', ' + wrongMidX + ' ' + endY + ', ' + endX + ' ' + endY;
                    wrongLine.setAttribute('d', wrongD);
                    wrongLine.classList.add('drag-arrow-line', 'wrong');
                    svg.appendChild(wrongLine);
                }
            }
            
            svg.appendChild(line);
        });
    } else {
        // In interactive mode, draw arrows for user's current selections
        userAns.forEach((itemIdx, targetIdx) => {
            if (itemIdx < 0 || itemIdx >= itemPositions.length) return;
            if (targetIdx >= targetPositions.length) return;
            
            const itemPos = itemPositions[itemIdx];
            const targetPos = targetPositions[targetIdx];
            
            if (!itemPos || !targetPos) return;
            
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            
            const startX = itemPos.right + 5;
            const startY = itemPos.centerY;
            const endX = targetPos.left - 5;
            const endY = targetPos.centerY;
            const midX = (startX + endX) / 2;
            const d = 'M ' + startX + ' ' + startY + ' C ' + midX + ' ' + startY + ', ' + midX + ' ' + endY + ', ' + endX + ' ' + endY;
            
            line.setAttribute('d', d);
            line.classList.add('drag-arrow-line');
            svg.appendChild(line);
        });
    }
}

function removeFromTarget(targetIdx) {
    const q = AppState.examQuestions[AppState.currentIdx];
    if (!q) return;
    if (AppState.userAnswers[AppState.currentIdx] && Array.isArray(AppState.userAnswers[AppState.currentIdx])) {
        AppState.userAnswers[AppState.currentIdx][targetIdx] = -1;
    }
    saveProgressState();
    const questionCard = document.getElementById('question-card');
    if (questionCard) {
        const q2 = AppState.examQuestions[AppState.currentIdx];
        const isSubmitted = AppState.submittedFlags[AppState.currentIdx] || false;
        const isMemorize = AppState.quizMode === 'memorize';
        const ans = AppState.userAnswers[AppState.currentIdx];
        questionCard.innerHTML = renderQuestionContent(q2, AppState.currentIdx, isMemorize, isSubmitted, ans);
        initDragListeners();
    }
}

function practiceFeedbackHTML(correct, q) {
    let html = '';
    html += `<div class="feedback-bar ${correct ? 'correct' : 'wrong'}"><span class="feedback-icon">${correct ? '&#10004;' : '&#10008;'}</span> ${correct ? '回答正确！' : '回答错误'}</div>`;
    html += `<div class="explanation-box">
      <strong>正确答案：</strong>${getCorrectAnswerText(q)}<br>
      <strong>解析：</strong>${q.explanation || '暂无解析'}
    </div>`;
    if (q.explanationImage) {
        html += `<div class="question-img"><img src="${q.explanationImage}" alt="解析图" loading="lazy" onerror="this.outerHTML='<div style=&quot;padding:24px;text-align:center;color:var(--text3);background:rgba(0,0,0,0.03);border-radius:12px;border:1px dashed var(--glass-border)&quot;>📷 图片加载失败</div>'"></div>`;
    }

    }

}

// ============ Answer helpers ============
function getCorrectAnswerText(q) {
    if (q.type === 'single') {
        if (!q.options || !q.answer || q.answer.length === 0) return 'N/A';
        return String.fromCharCode(65 + q.answer[0]) + '. ' + (q.options[q.answer[0]] || '');
    }
    if (q.type === 'multiple') {
        if (!q.options || !q.answer) return 'N/A';
        return q.answer.map(a => String.fromCharCode(65 + a) + '. ' + (q.options[a] || '')).join('；');
    }
    if (q.type === 'judge') {
        return q.answer.includes(0) ? '正确' : '错误';
    }
    if (q.type === 'fill') {
        return (q.answer && q.answer[0]) ? q.answer[0] : 'N/A';
    }
    if (q.type === 'drag') {
        if (!q.dragTargets || !q.dragAnswer || !q.dragItems) return 'N/A';
        return q.dragTargets.map((t, i) => {
            const idx = q.dragAnswer[i];
            return t + ' → ' + (idx >= 0 ? q.dragItems[idx] : '无');
        }).join('，');
    }
    return 'N/A';
}

function hasUserAnswered(ans, q) {
    if (ans === undefined || ans === null) return false;
    if (q.type === 'single' || q.type === 'judge') return true;
    if (q.type === 'multiple') return Array.isArray(ans) && ans.length > 0;
    if (q.type === 'fill') return String(ans || '').trim() !== '';
    if (q.type === 'drag') return Array.isArray(ans) && ans.some(a => a >= 0);
    return false;
}

function isAnswerCorrect(idx) {
    const q = AppState.examQuestions[idx];
    const ans = AppState.userAnswers[idx];
    if (ans === undefined || ans === null) return false;
    if (q.type === 'single' || q.type === 'judge') {
        return q.answer.includes(ans);
    }
    if (q.type === 'multiple') {
        if (!Array.isArray(ans)) return false;
        if (ans.length !== q.answer.length) return false;
        return ans.every(a => q.answer.includes(a));
    }
    if (q.type === 'fill') {
        const normalize = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
        return normalize(ans) === normalize(q.answer[0]);
    }
    if (q.type === 'drag') {
        if (!Array.isArray(ans)) return false;
        const correct = q.dragAnswer || [];
        if (correct.length === 0) return false;
        for (let i = 0; i < correct.length; i++) {
            if ((ans[i] === undefined || ans[i] === null || ans[i] < 0) && correct[i] >= 0) return false;
            if (ans[i] >= 0 && ans[i] !== correct[i]) return false;
        }
        return true;
    }
    return false;
}

function goToQuestion(i) {
