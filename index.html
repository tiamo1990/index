// Swap question content without full render() — local DOM update only
function _swapQuestionContent() {
    var card = document.getElementById('question-card');
    var navInfo = document.querySelector('.nav-info');
    var navBtns = document.querySelector('.nav-btns');
    var panelStats = document.querySelector('.panel-stats');
    if (!card) return;

    var idx = AppState.currentIdx;
    var total = AppState.examQuestions.length;
    var q = AppState.examQuestions[idx];
    var isMemorize = AppState.quizMode === 'memorize';
    var isExam = AppState.quizMode === 'exam';
    var isSubmitted = AppState.submittedFlags[idx];
    var ans = AppState.userAnswers[idx];

    // Update nav info
    if (navInfo) navInfo.textContent = (idx + 1) + ' / ' + total + ' 题';

    // Update nav buttons disabled state
    if (navBtns) {
        var prevBtn = navBtns.querySelector('[onclick*="prevQuestion"]');
        var nextBtn = navBtns.querySelector('[onclick*="nextQuestion"]');
        var submitBtn = navBtns.querySelector('[onclick*="submitPracticeQuestion"]');
        if (prevBtn) prevBtn.disabled = (idx === 0);
        if (nextBtn) {
            var lastQ = (idx >= total - 1);
            nextBtn.disabled = false; // skip is always available
        }
        if (submitBtn) {
            submitBtn.disabled = isSubmitted;
            submitBtn.textContent = isSubmitted ? '已提交' : '提交本题';
            submitBtn.style.opacity = isSubmitted ? '0.5' : '1';
        }
    }

    // Swap question content
    card.innerHTML = renderQuestionContent(q, idx, isMemorize, isSubmitted, ans);

    // Re-init drag listeners if drag question
    if (q.type === 'drag') initDragListeners();

    // Update answer sheet nav numbers
    document.querySelectorAll('.nav-num').forEach(function(el) {
        el.classList.remove('current');
    });
    var curNavNum = document.querySelector('.nav-num[data-idx="' + idx + '"]');
    if (curNavNum) curNavNum.classList.add('current');

    // Update panel stats
    if (panelStats) {
        var done = Object.values(AppState.submittedFlags).filter(Boolean).length;
        panelStats.textContent = done + '/' + total;
    }
}
function prevQuestion() {
    if (AppState.currentIdx > 0) { AppState.currentIdx--; goToQuestion(AppState.currentIdx); }
}
function nextQuestion() {
    if (AppState.currentIdx < AppState.examQuestions.length - 1) {
        AppState.currentIdx++;
        goToQuestion(AppState.currentIdx);
    } else if (AppState.quizMode === 'exam') {
        confirmSubmitExam();
    }
}


// ============ Swipe Gestures (Mobile) ============
function initSwipeGestures() {
    const card = document.querySelector('.question-card');
    if (!card) return;
    let startX = 0, startY = 0;
    card.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
    card.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
            if (dx < 0) nextQuestion();
            else prevQuestion();
        }
    }, { passive: true });
}

// ============ Re-take Exam from History Record ============
function retakeExamFromRecord(recordId) {
    const history = getExamHistory();
    const rec = history.find(r => r.id === recordId);
    if (!rec) { showToast('记录不存在'); return; }
    if (!rec.questions || rec.questions.length === 0) { showToast('题目数据缺失，无法重考'); return; }
    const questions = rec.questions.map(q => {
        const fresh = Object.assign({}, q);
        delete fresh.userAnswer; delete fresh.isCorrect;
        return shuffleOptions(fresh);
    });
    AppState.examQuestions = questions;
    AppState.quizMode = 'practice-random';
    AppState.currentIdx = 0;
    AppState.userAnswers = {};
    AppState.submittedFlags = {};
    AppState.currentView = 'quiz';
    render();
    showToast('已加载 ' + questions.length + ' 题，开始重考');
}

    if (AppState.timerInterval) { clearInterval(AppState.timerInterval); AppState.timerInterval = null; }
    if (AppState.autoSaveInterval) { clearInterval(AppState.autoSaveInterval); AppState.autoSaveInterval = null; }
}


function saveProgressState() {

}
function saveProgressAndExit() {

        AppState.fromSearch = false;

// ============ Practice Submit ============
function submitPracticeQuestion() {
    if (AppState.quizMode === 'memorize') { AppState.currentIdx++; render(); return; }
    const q = AppState.examQuestions[AppState.currentIdx];
    const ans = AppState.userAnswers[AppState.currentIdx];
    if (ans === undefined || ans === null || (Array.isArray(ans) && ans.length === 0)) {
        alert('请先作答。');
        return;
    }
    AppState.submittedFlags[AppState.currentIdx] = true;
    const correct = isAnswerCorrect(AppState.currentIdx);
    if (!correct) {
        if (AppState.quizMode !== 'exam') {
            addToWrongBook(q.id);
            incrementWrongCount(q.id);
        }
    } else {
        if (AppState.quizMode !== 'exam') removeFromWrongBook(q.id);
    }
    saveProgressState();

    // 重绘题目卡片：显示正确答案 + 解析（不需要整页 render()）
    const card = document.getElementById('question-card');
    if (card) {
        card.innerHTML = renderQuestionContent(q, AppState.currentIdx, false, true, ans);
        if (q.type === 'drag') initDragListeners();
    }
    // 更新答题卡题号状态
    var navNum = document.querySelector('.nav-num.current');
    if (navNum) {
        navNum.classList.remove('unanswered');
        navNum.classList.add(correct ? 'correct' : 'wrong');
    }
    // 更新答题卡统计
    var panelStats = document.querySelector('.panel-stats');
    if (panelStats) {
        var done = Object.values(AppState.submittedFlags).filter(Boolean).length;
        panelStats.textContent = done + '/' + AppState.examQuestions.length;
    }
    // 更新提交按钮状态
    var navBtns = document.querySelector('.nav-btns');
    if (navBtns) {
        var submitBtn = navBtns.querySelector('[onclick*="submitPracticeQuestion"]');
        if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = '已提交'; }
    }
}

function confirmSubmitExam() {
    const answered = AppState.examQuestions.filter((q, i) => hasUserAnswered(AppState.userAnswers[i], q)).length;
    const total = AppState.examQuestions.length;
    const unanswered = total - answered;
    const app = document.getElementById('app');
    app.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay" id="submit-modal">
      <div class="modal-box">
        <div class="modal-title">确认交卷</div>
        <div class="modal-body">

        </div>
        <div class="modal-actions">

        </div>
      </div>

function submitExam() {
    clearInterval(AppState.timerInterval);
    stopAutoSave();
    // Remove only the current mode's save, not all saves
    let saves = getAllSaves().filter(s => s.mode !== AppState.quizMode);
    localStorage.setItem(getKey('saves'), JSON.stringify(saves));
    // Record wrong answers — only for actually attempted questions
    AppState.examQuestions.forEach((q, i) => {
        if (hasUserAnswered(AppState.userAnswers[i], q) && !isAnswerCorrect(i)) {
            addToWrongBook(q.id);
            incrementWrongCount(q.id);
        }
    });
    // Mark all questions as submitted for result rendering
    AppState.examQuestions.forEach((q, i) => { AppState.submittedFlags[i] = true; });
    saveExamHistory();
    AppState.currentView = 'result';
    render();
}

// ============ Exam History ============
function saveExamHistory() {
    const total = AppState.examQuestions.length;
    let correctCount = 0;
    let unansweredCount = 0;
    const typeStats = { single: { total: 0, correct: 0 }, multiple: { total: 0, correct: 0 }, judge: { total: 0, correct: 0 }, fill: { total: 0, correct: 0 }, drag: { total: 0, correct: 0 } };
    AppState.examQuestions.forEach((q, i) => {
        if (!hasUserAnswered(AppState.userAnswers[i], q)) unansweredCount++;
        if (isAnswerCorrect(i)) correctCount++;
        if (typeStats[q.type]) {
            typeStats[q.type].total++;
            if (isAnswerCorrect(i)) typeStats[q.type].correct++;
        }
    });
    const wrongCount = total - correctCount - unansweredCount;
    const elapsed = AppState.examStartTime ? Math.floor((Date.now() - AppState.examStartTime) / 1000) : 0;
    const totalScore = AppState.examTotalScore;
    // Weighted scoring: different point values per question type (closer to real H12-821 exam)
    const TYPE_WEIGHTS = { single: 2, multiple: 3, judge: 2, fill: 4, drag: 4 };
    const totalWeight = AppState.examQuestions.reduce((s, q) => s + (TYPE_WEIGHTS[q.type] || 2), 0);
    const scorePerWeight = totalWeight > 0 ? totalScore / totalWeight : 0;
    let score = 0;
    AppState.examQuestions.forEach((q, i) => {
        if (isAnswerCorrect(i)) score += (TYPE_WEIGHTS[q.type] || 2) * scorePerWeight;
    });
    score = Math.round(score);
    const passed = score >= AppState.examPassScore;
    
    const record = {
        id: Date.now(),
        date: new Date().toISOString(),
        score, totalScore, passScore: AppState.examPassScore, passed,
        total, correctCount, wrongCount, unansweredCount,
        elapsed,
        typeStats,
        // Store full snapshot: questions (with shuffled options), user answers
        questions: AppState.examQuestions.map((q, i) => ({
            id: q.id, type: q.type, question: q.question, questionImage: q.questionImage,
            options: q.options, answer: q.answer,
            dragItems: q.dragItems, dragTargets: q.dragTargets, dragAnswer: q.dragAnswer,
            explanation: q.explanation, explanationImage: q.explanationImage,
            userAnswer: AppState.userAnswers[i], isCorrect: isAnswerCorrect(i)
        }))
    };
    let history = getExamHistory();
    history.unshift(record);
    if (history.length > 50) history = history.slice(0, 50);
    localStorage.setItem(getKey('examHistory'), JSON.stringify(history));
    
    // Store for current result display
    window._lastExamRecord = record;
}
function getExamHistory() {
    try { return JSON.parse(localStorage.getItem(getKey('examHistory'))) || []; } catch(e) { return []; }
}
function deleteExamHistory(id) {
    let history = getExamHistory().filter(r => r.id !== id);
    localStorage.setItem(getKey('examHistory'), JSON.stringify(history));
}
function clearExamHistory() {
    localStorage.removeItem(getKey('examHistory'));
}
function getExamHistoryCount() { return getExamHistory().length; }

    // Compute per-type scores
    const typeOrder = ['single', 'multiple', 'judge', 'fill', 'drag'];
    const TYPE_WEIGHTS = { single: 2, multiple: 3, judge: 2, fill: 4, drag: 4 };
    const totalWeight = (rec.questions || []).reduce((s, q) => s + (TYPE_WEIGHTS[q.type] || 2), 0);
    const scorePerWeight = totalWeight > 0 ? totalScore / totalWeight : 0;
    
    app.innerHTML = `

      <div class="result-stats">
        <div class="result-stat"><div class="num" style="color:var(--success)">${correctCount}</div><div class="label">正确</div></div>
        <div class="result-stat"><div class="num" style="color:var(--danger)">${wrongCount}</div><div class="label">错误</div></div>
        <div class="result-stat"><div class="num" style="color:var(--text2)">${unansweredCount}</div><div class="label">未答</div></div>
        <div class="result-stat"><div class="num" style="color:var(--primary)">${pct}%</div><div class="label">正确率</div></div>
      </div>
      
      <div style="margin-top:16px;font-size:13px;color:var(--text2)">
        用时 ${elapsedMin} 分 ${elapsedSec} 秒
      </div>
      
      <div style="margin-top:16px;padding:12px 16px;background:var(--surface-bg);border-radius:8px;border:1px solid var(--border)">
        <div style="font-weight:600;margin-bottom:8px">各题型得分</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px">
          ${typeOrder.map(t => {
            const st = typeStats[t] || { total: 0, correct: 0 };
            if (st.total === 0) return '';
            const tWeight = st.correct * (TYPE_WEIGHTS[t] || 2);
            const tScore = Math.round(tWeight * scorePerWeight);
            const tMaxWeight = st.total * (TYPE_WEIGHTS[t] || 2);
            const tMaxScore = Math.round(tMaxWeight * scorePerWeight);
            const pct = tMaxScore > 0 ? Math.round(tScore / tMaxScore * 100) : 0;
            const barColors = { single: '#8b5cf6', multiple: '#f97316', judge: '#22c55e', fill: '#3b82f6', drag: '#ec4899' };
            return '<div style="padding:8px;background:var(--card-inner);border-radius:6px;text-align:center">'
              + '<span class="question-badge ' + TYPE_COLORS[t] + '" style="margin-bottom:4px;display:inline-block">' + TYPE_LABELS[t] + '</span>'
              + '<div style="font-weight:700;font-size:16px;color:var(--primary)">' + tScore + '</div>'
              + '<div style="font-size:11px;color:var(--text2)">' + st.correct + '/' + st.total + '</div>'
              + '<div style="margin-top:6px;height:4px;background:var(--glass-border);border-radius:2px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:' + (barColors[t]||'var(--primary)') + ';border-radius:2px"></div></div>'
              + '</div>';
          }).join('')}

      </div>

        <button class="btn btn-outline" onclick="renderExamDetail(window._lastExamRecord)">查看错题详情</button>
        <button class="btn btn-ghost" onclick="AppState.currentView='home';render()">返回首页</button>
      </div>
    </div>`;
    // Animate score counter
    const scoreEl = document.getElementById('result-score-el');
    if (scoreEl) {
        const target = parseInt(scoreEl.getAttribute('data-target')) || 0;
        const duration = 1200;
        const start = performance.now();
        function updateScore(now) {
            const elapsed = now - start;
            const progress = Math.min(elapsed / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            scoreEl.textContent = Math.round(eased * target);
            if (progress < 1) requestAnimationFrame(updateScore);
        }
        requestAnimationFrame(updateScore);
    }
}

// ============ Keyboard shortcuts ============
document.addEventListener('keydown', function(e) {
    if (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA") return;
    if (AppState.currentView !== 'quiz') return;

    const q = AppState.examQuestions[AppState.currentIdx];
    if (!q) return;

    // 方向键导航：始终可用（提交后也可以翻题）
    if (e.key === 'ArrowLeft') { prevQuestion(); e.preventDefault(); return; }
    if (e.key === 'ArrowRight') { nextQuestion(); e.preventDefault(); return; }

    if (AppState.quizMode === 'memorize') return;

    // 提交后（练习模式）只允许导航，屏蔽答题键
    if (AppState.submittedFlags[AppState.currentIdx] && AppState.quizMode !== 'exam') return;

    if (e.key === '?' || (e.key === '/' && !e.shiftKey)) { showShortcutHelp(); e.preventDefault(); return; }
    if (e.key === 'Enter') {
        if (AppState.quizMode === 'exam') nextQuestion();
        else submitPracticeQuestion();
        e.preventDefault();
    }
    else if (q.type === 'single' || q.type === 'multiple') {
        const letters = ['a','b','c','d','e','f','g','h'];
        const idx = letters.indexOf(e.key.toLowerCase());
        if (idx >= 0 && idx < (q.options || []).length) {
            if (q.type === 'single') selectSingle(idx);
            else toggleMulti(idx);
            e.preventDefault();
        }
    }
    else if (q.type === 'judge') {
        if (e.key === 'a' || e.key === '1') selectJudge(0);
        else if (e.key === 'b' || e.key === '2') selectJudge(1);
    }
});

function exportData() {
    const data = {
        version: 1,
        exportDate: new Date().toISOString(),
        saves: JSON.parse(localStorage.getItem(getKey('saves')) || '[]'),
        wrong: JSON.parse(localStorage.getItem(getKey('wrong')) || '[]'),
        wrongCounts: JSON.parse(localStorage.getItem(getKey('wrongCounts')) || '{}'),
        favorites: JSON.parse(localStorage.getItem(getKey('favorites')) || '[]'),
        examHistory: JSON.parse(localStorage.getItem(getKey('examHistory')) || '[]')
    };
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'hcip_backup_' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('数据已导出');
}
function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const data = JSON.parse(ev.target.result);
                // 验证数据结构
                if (!data || typeof data !== 'object') throw new Error('无效的数据格式');
                if (data.version && typeof data.version !== 'number') throw new Error('版本号格式错误');
                if (data.wrong && !Array.isArray(data.wrong)) throw new Error('错题数据格式错误');
                if (data.favorites && !Array.isArray(data.favorites)) throw new Error('收藏数据格式错误');
                if (data.examHistory && !Array.isArray(data.examHistory)) throw new Error('考试记录格式错误');
                if (data.wrongCounts && typeof data.wrongCounts !== 'object') throw new Error('错题计数格式错误');
                
                // 确认覆盖
                const currentWrong = JSON.parse(localStorage.getItem(getKey('wrong')) || '[]');
                const currentFav = JSON.parse(localStorage.getItem(getKey('favorites')) || '[]');
                if (currentWrong.length > 0 || currentFav.length > 0) {
                    if (!confirm('导入将覆盖当前数据（' + currentWrong.length + ' 条错题，' + currentFav.length + ' 条收藏）\n确定继续？')) {
                        showToast('已取消导入');
                        return;
                    }
                }
                
                // 安全导入
                if (data.saves !== undefined) localStorage.setItem(getKey('saves'), JSON.stringify(data.saves || []));
                if (data.wrong !== undefined) localStorage.setItem(getKey('wrong'), JSON.stringify(data.wrong || []));
                if (data.wrongCounts !== undefined) localStorage.setItem(getKey('wrongCounts'), JSON.stringify(data.wrongCounts || {}));
                if (data.favorites !== undefined) localStorage.setItem(getKey('favorites'), JSON.stringify(data.favorites || []));
                if (data.examHistory !== undefined) localStorage.setItem(getKey('examHistory'), JSON.stringify(data.examHistory || []));
                
                // Reload in-memory state
                loadFavorites();
                loadWrongCounts();
                showToast('✅ 数据导入成功，共恢复 ' + (data.wrong?.length || 0) + ' 条错题，' + (data.examHistory?.length || 0) + ' 条考试记录');
                AppState.currentView = 'home';
                render();
            } catch(err) {
                showToast('❌ 导入失败: ' + err.message);
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

  // ============ Dynamic Script Loader ============
  function loadScript(url, callback, retryCount) {
    retryCount = retryCount || 0;
    var MAX_RETRIES = 3;
    var script = document.createElement('script');
    script.src = url;
    script.onload = callback;
    script.onerror = function() {
      if (retryCount < MAX_RETRIES) {
        var delay = Math.pow(2, retryCount) * 500;
        console.warn('[loadScript] Retrying in ' + delay + 'ms (' + (retryCount + 1) + '/' + MAX_RETRIES + '): ' + url);
        setTimeout(function() { loadScript(url, callback, retryCount + 1); }, delay);
      } else {
        console.error('[loadScript] Max retries reached: ' + url);
        var app = document.getElementById('app');
        if (app) {
          app.innerHTML = '<div style="text-align:center;padding:60px 20px"><h2 style="color:var(--danger)">加载失败</h2><p style="color:var(--text2);margin:12px 0">题库数据加载失败，请检查网络连接</p><button class="btn btn-primary" onclick="location.reload()">重试</button></div>';
        } else {
          showToast('加载题库数据失败: ' + url);
        }
      }
    };
    document.head.appendChild(script);
  }

          onkeyup="doSearch(this.value)">
      </div>

var _searchTimer = null;
function doSearch(query) {
    clearTimeout(_searchTimer);
    _searchTimer = setTimeout(function() {
        _doSearchResults(query);
    }, 250);
}

function _doSearchResults(query) {
    const el = document.getElementById('search-results');
    if (!el) return;
    const q = (query || '').trim();
    if (q.length < 1) { el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text3);font-size:14px">输入关键词开始搜索</div>'; return; }
    const data = getQuizData();
    const qid = parseInt(q);
    var results = [];
    if (!isNaN(qid)) {
        // Search by ID
        results = data.filter(function(item) { return item.id === qid; });
    }
    // Also search by keyword
    var kw = q.toLowerCase();
    var byText = data.filter(function(item) {
        return item.question.toLowerCase().indexOf(kw) >= 0 ||
            (item.explanation && item.explanation.toLowerCase().indexOf(kw) >= 0) ||
            (item.type && item.type.indexOf(kw) >= 0);
    });
    // Merge: prefer ID matches, deduplicate
    var seen = {};
    results.forEach(function(r) { seen[r.id] = true; });
    byText.forEach(function(r) { if (!seen[r.id]) { results.push(r); seen[r.id] = true; } });
    
    if (results.length === 0) {
        el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text3)"><div style="font-size:40px;margin-bottom:12px;opacity:0.5">🔍</div><p>未找到匹配的题目</p></div>';
        return;
    }
    // Save query for startFromSearch to use when returning
    AppState.lastSearchQuery = q;
    var totalCount = Math.min(results.length, 100);
    var kwLower = q.toLowerCase();
    var kwEscape = q.replace(/[<>"'&]/g, '');
    function highlight(text) {
        if (!kwEscape) return escapeHtml(text);
        var t = escapeHtml(text);
        var idx2 = t.toLowerCase().indexOf(kwLower);
        if (idx2 < 0) return t;
        return t.substring(0, idx2) + '<mark style="background:rgba(251,191,36,0.4);color:inherit;padding:0 2px;border-radius:2px">' + t.substring(idx2, idx2 + kwEscape.length) + '</mark>' + t.substring(idx2 + kwEscape.length);
    }
    function escapeHtml(s) {
        return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }
    function typeColor(c) {
        return ({single:'#2563eb',multiple:'#7c3aed',judge:'#059669',fill:'#d97706',drag:'#dc2626'})[c] || '#666';
    }
    el.innerHTML = '<div style="margin-bottom:12px;font-size:13px;color:var(--text2)">找到 ' + results.length + ' 条结果' + (results.length > 100 ? '（显示前100条）' : '') + '</div>'
        + results.slice(0, totalCount).map(function(item) {
            var preview = item.question.length > 90 ? item.question.substring(0, 90) + '...' : item.question;
            var tip = '';
            if (item.explanation) {
                tip = item.explanation.length > 60 ? item.explanation.substring(0, 60) + '...' : item.explanation;
            }
            return '<div class="search-card" onclick="startFromSearch(' + item.id + ')">'
                + '<div class="search-card-header">'
                  + '<span class="question-badge ' + (TYPE_COLORS[item.type] || '') + '">' + TYPE_LABELS[item.type] + '</span>'
                  + '<strong style="font-size:14px">Q' + item.id + '</strong>'
                  + '<span style="margin-left:auto;font-size:12px;color:var(--text3)">练习 →</span>'
                + '</div>'
                + '<div class="search-card-body">' + highlight(preview) + '</div>'
                + (tip ? '<div class="search-card-tip">💡 ' + highlight(tip) + '</div>' : '')
                + '</div>';
        }).join('') + '<div style="margin-top:16px;text-align:center;font-size:12px;color:var(--text3);padding:8px 0">点击卡片进入练习，不会保存到继续练习列表</div>';
}

// ============ 草稿纸 ============
AppState.draftNotes = '';
AppState.draftPaperOpen = false;

function loadDraftNotes() {
    try { AppState.draftNotes = localStorage.getItem('hcip_'+AppState.currentSubject+'_draft') || ''; } catch(e) { AppState.draftNotes = ''; }
}
function saveDraftNotes() {
    try { localStorage.setItem('hcip_'+AppState.currentSubject+'_draft', AppState.draftNotes); } catch(e) {}
}

function toggleDraftPaper() {
    AppState.draftPaperOpen = !AppState.draftPaperOpen;
    var existing = document.getElementById('draft-paper');
    if (AppState.draftPaperOpen && !existing) {
        var div = document.createElement('div');
        div.id = 'draft-paper';
        div.style.cssText = 'position:fixed;bottom:0;right:0;width:320px;max-width:90vw;height:240px;background:var(--card-bg);border:1px solid var(--glass-border);border-radius:var(--radius) var(--radius) 0 0;box-shadow:0 -4px 20px rgba(0,0,0,0.15);z-index:999;display:flex;flex-direction:column;animation:pageFadeIn 0.2s ease-out;';
        div.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--glass-border)"><strong style="font-size:13px">📝 草稿纸</strong><button class="btn btn-ghost btn-xs" onclick="toggleDraftPaper()" style="font-size:12px;padding:2px 8px">✕</button></div>'
            + '<textarea id="draft-textarea" placeholder="在此记录草稿..." style="flex:1;width:100%;border:none;resize:none;padding:12px 14px;font-size:13px;background:transparent;color:var(--text);outline:none" oninput="AppState.draftNotes=this.value;saveDraftNotes()"></textarea>';
        document.body.appendChild(div);
        var ta = document.getElementById('draft-textarea');
        if (ta) { ta.value = AppState.draftNotes; ta.focus(); }
    } else if (existing) {
        existing.remove();
    }
}

// ============ 答题笔记 ============
function getQuestionNote(qid) {
    try { return JSON.parse(localStorage.getItem('hcip_'+AppState.currentSubject+'_notes')) || {}; } catch(e) { return {}; }
}
function setQuestionNote(qid, text) {
    var notes = getQuestionNote();
    if (text.trim()) { notes[qid] = text.trim(); }
    else { delete notes[qid]; }
    localStorage.setItem('hcip_'+AppState.currentSubject+'_notes', JSON.stringify(notes));
}
function hasQuestionNote(qid) {
    var notes = getQuestionNote();
    return !!notes[qid];
}
function toggleQuestionNote() {
    var q = AppState.examQuestions[AppState.currentIdx];
    if (!q) return;
    var existing = document.getElementById('qnote-' + q.id);
    if (existing) { existing.remove(); return; }
    var card = document.getElementById('question-card');
    if (!card) return;
    var notes = getQuestionNote();
    var noteBox = document.createElement('div');
    noteBox.id = 'qnote-' + q.id;
    noteBox.style.cssText = 'margin-top:12px;padding:12px;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.25);border-radius:var(--radius-sm);animation:pageFadeIn 0.2s ease-out;';
    noteBox.innerHTML = '<div style="font-size:12px;font-weight:600;margin-bottom:6px;color:#d97706">📝 我的笔记</div>'
        + '<textarea id="qnote-text-'+ q.id +'" placeholder="记录关于这道题的想法..." style="width:100%;min-height:50px;border:none;resize:vertical;padding:8px;font-size:13px;background:rgba(255,255,255,0.5);border-radius:6px;color:var(--text);outline:none" oninput="setQuestionNote('+ q.id +', this.value)">'
        + (notes[q.id] || '') + '</textarea>'
        + '<div style="font-size:11px;color:var(--text3);margin-top:4px">笔记仅保存在本地</div>';
    card.appendChild(noteBox);
}
